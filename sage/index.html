<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f6f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sage">

  <title>Sage</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Onboarding screen, shown only on first launch -->
  <section id="onboarding" class="screen" hidden>
    <div class="onboarding-content">
      <h1 class="logo">Sage</h1>
      <p class="onboarding-intro">
        A quiet place to think out loud.
      </p>

      <form id="onboarding-form" class="settings-form">
        <label class="field">
          <span class="field-label">Server URL</span>
          <input type="url" name="server_url" id="onb-server-url"
                 placeholder="http://edupath.local:8080" required
                 autocomplete="off" autocapitalize="off"
                 spellcheck="false">
          <span class="field-hint">Provided during setup.</span>
        </label>

        <label class="field">
          <span class="field-label">Access token</span>
          <input type="text" name="token" id="onb-token"
                 placeholder="paste your token here" required
                 autocomplete="off" autocapitalize="off"
                 spellcheck="false">
          <span class="field-hint">From the home machine setup.</span>
        </label>

        <button type="submit" class="primary-button">Connect</button>
        <p id="onb-status" class="status-line" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- Main app: conversation view -->
  <main id="app" class="screen" hidden>

    <header class="app-header">
      <button class="icon-button" id="open-thread-list" aria-label="Past conversations">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="app-title">Sage</h1>
      <button class="icon-button" id="open-settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div id="sync-indicator" class="sync-indicator" hidden aria-live="polite"></div>

    <div id="conversation-view" class="conversation-view" role="log" aria-live="polite">
      <p class="empty-state" id="empty-state">
        Say what's on your mind. Sage replies on the next sync.
      </p>
    </div>

    <form id="message-form" class="message-form">
      <textarea
        id="message-input"
        placeholder="What's going on?"
        rows="1"
        autocomplete="off"
        autocapitalize="sentences"
        spellcheck="true"
      ></textarea>
      <div class="message-actions">
        <button type="button" id="end-conversation" class="text-button">End conversation</button>
        <button type="submit" id="send-button" class="primary-button-small" disabled>Send</button>
      </div>
    </form>
  </main>

  <!-- Thread list drawer -->
  <aside id="thread-drawer" class="drawer" hidden>
    <div class="drawer-content">
      <header class="drawer-header">
        <h2>Past conversations</h2>
        <button class="icon-button" id="close-thread-drawer" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <button id="new-conversation" class="text-button new-conv">+ New conversation</button>
      <ul id="thread-list" class="thread-list"></ul>
    </div>
    <div class="drawer-backdrop" id="thread-backdrop"></div>
  </aside>

  <!-- Settings drawer -->
  <aside id="settings-drawer" class="drawer" hidden>
    <div class="drawer-content">
      <header class="drawer-header">
        <h2>Settings</h2>
        <button class="icon-button" id="close-settings-drawer" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <form id="settings-form" class="settings-form">
        <label class="field">
          <span class="field-label">Server URL</span>
          <input type="url" name="server_url" id="settings-server-url" required>
        </label>
        <label class="field">
          <span class="field-label">Access token</span>
          <input type="text" name="token" id="settings-token" required>
        </label>
        <button type="submit" class="primary-button">Save</button>
      </form>

      <div class="settings-info">
        <p><strong>Sync state</strong></p>
        <dl class="info-list">
          <dt>Last sync</dt><dd id="info-last-sync">never</dd>
          <dt>Pending messages</dt><dd id="info-pending-count">0</dd>
          <dt>Device ID</dt><dd id="info-device-id" class="mono"></dd>
        </dl>
        <button id="manual-sync" class="text-button">Sync now</button>
      </div>
    </div>
    <div class="drawer-backdrop" id="settings-backdrop"></div>
  </aside>

  <!-- Generic offline / error banner -->
  <div id="banner" class="banner" hidden role="status" aria-live="polite">
    <span id="banner-message"></span>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
