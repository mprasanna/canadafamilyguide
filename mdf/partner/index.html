  --sh-ink:#221C15;--sh-sub:#6B5F4E;--sh-faint:#9C8F79;

  --sh-card:#FFFDF8;--sh-line:#E5DCC9;--sh-line-soft:#EFE8D9;

}
.sh-topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(244,238,227,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--sh-line);
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;font-family:'Manrope',system-ui,sans-serif;
}
.sh-brand{display:flex;align-items:center;gap:11px;text-decoration:none;cursor:pointer}
.sh-mark{width:30px;height:30px;background:var(--sh-clay);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.sh-brand-name{font-size:15px;font-weight:500;font-family:'Newsreader',Georgia,serif;color:var(--sh-ink);letter-spacing:-.01em;line-height:1}
.sh-brand-sub{font-size:10.5px;color:var(--sh-faint);letter-spacing:.02em;margin-top:1px}
.sh-nav{display:flex;align-items:center;gap:4px}
.sh-nav-link{font-size:13px;font-weight:600;color:var(--sh-sub);text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .13s;cursor:pointer;background:none;border:none;font-family:inherit}
.sh-nav-link:hover{background:var(--sh-paper-alt);color:var(--sh-ink)}
.sh-nav-link.active{background:var(--sh-gold-l);color:var(--sh-gold-d)}
.sh-nav-sep{color:var(--sh-line);font-size:16px;margin:0 2px;user-select:none}
.sh-portal-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase;margin-left:8px}
.sh-portal-badge.partner{background:var(--sh-gold-l);color:var(--sh-gold-d)}
.sh-portal-badge.pam{background:rgba(28,24,18,.08);color:var(--sh-nav)}
.sh-portal-badge.guide{background:var(--sh-sage-l);color:var(--sh-sage)}

  font-family:'Manrope',system-ui,sans-serif;

/* ═══════════════════════════════════════════════════════════
   PARTNER PORTAL · WARM EDITORIAL — SHARED KIT
   Theme tokens · injected stylesheet (fonts, responsive, hover) ·
   primitive components · partner data · helpers.  All on window.
   ═══════════════════════════════════════════════════════════ */

const EDI = {
  paper:'#F4EEE3', paperAlt:'#EFE7D8', ink:'#221C15', sub:'#6B5F4E', faint:'#9C8F79',
  clay:'#A8432E', clayD:'#8A331F', gold:'#C98A36', goldD:'#9A6500', goldL:'#FBEFD8',
  sage:'#4F6B50', sageD:'#3E5640', sageL:'#E7F0E6', card:'#FFFDF8', line:'#E5DCC9',
  lineSoft:'#EFE8D9', redL:'#F7E4DC', red:'#A8432E',
  serif:"'Newsreader', Georgia, serif", sans:"'Manrope', system-ui, sans-serif",
};

/* ── inject global stylesheet once ───────────────── */
(function injectKit(){

  *{box-sizing:border-box}
  .pp-app{font-family:${EDI.sans};color:${EDI.ink};background:${EDI.paper};-webkit-font-smoothing:antialiased;min-height:100vh}
  .pp-app ::selection{background:${EDI.goldL}}
  .pp-serif{font-family:${EDI.serif}}
  .pp-wrap{max-width:1180px;margin:0 auto;padding:0 40px}
  .pp-eyebrow{font-family:${EDI.sans};font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

  /* nav */

  .pp-nav-link.active{color:${EDI.ink}}

  /* buttons */
  .pp-btn{font-family:${EDI.sans};font-size:15px;font-weight:700;border-radius:12px;padding:13px 24px;cursor:pointer;border:1.5px solid transparent;transition:transform .12s,background .14s,box-shadow .14s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;white-space:nowrap}

  .pp-btn--clay{background:${EDI.clay};color:#fff;box-shadow:0 8px 22px rgba(168,67,46,.22)}

  .pp-btn--ink{background:${EDI.ink};color:#fff}
  .pp-btn--ink:hover{background:#000}

  /* selectable chip-cards (activity type / options) */
  .pp-pick{background:${EDI.card};border:1.5px solid ${EDI.line};border-radius:16px;padding:22px;cursor:pointer;transition:all .15s;text-align:left}
  .pp-pick:hover{border-color:${EDI.gold};transform:translateY(-2px);box-shadow:0 10px 26px rgba(80,60,30,.08)}
  .pp-pick.is-sel{border-color:${EDI.clay};background:#FCF4EC;box-shadow:0 0 0 3px rgba(168,67,46,.12)}
  .pp-opt{background:${EDI.card};border:1.5px solid ${EDI.line};border-radius:11px;padding:11px 16px;cursor:pointer;font-family:${EDI.sans};font-size:14px;font-weight:600;color:${EDI.sub};transition:all .13s}
  .pp-opt:hover{border-color:${EDI.faint};color:${EDI.ink}}
  .pp-opt.is-sel{background:${EDI.clay};border-color:${EDI.clay};color:#fff}

  .pp-link{font-family:${EDI.sans};font-weight:700;color:${EDI.clay};cursor:pointer;background:none;border:none;font-size:14px}
  .pp-link:hover{color:${EDI.clayD}}
  .pp-rowlink{transition:background .12s}
  .pp-rowlink:hover{background:#FBF7EE}

  /* fade transition (translate-only — never gates visibility) */
  .pp-fade{animation:ppFade .26s ease}
  @keyframes ppFade{from{transform:translateY(8px)}to{transform:translateY(0)}}

  /* responsive */
  .pp-grid-2{display:grid;grid-template-columns:1fr 420px;gap:48px}
  .pp-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .pp-fund{display:grid;grid-template-columns:1fr 340px;gap:36px;align-items:start}
  .pp-hide-narrow{display:flex}
  @media(max-width:920px){
    .pp-wrap{padding:0 22px}
    .pp-grid-2{grid-template-columns:1fr;gap:30px}
    .pp-grid-3{grid-template-columns:1fr}
    .pp-fund{grid-template-columns:1fr}
    .pp-fund .pp-rail{position:static!important}
    .pp-hide-narrow{display:none}
    .pp-h1{font-size:38px!important}
  }
  .pp-sticky{position:sticky;top:88px}

  /* fund stepper layout */
  .pp-stepwrap{display:grid;grid-template-columns:194px 1fr 290px;gap:30px;align-items:start}
  .pp-picks{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .pp-f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 18px}
  @media(max-width:900px){
    .pp-stepwrap{grid-template-columns:1fr}
    .pp-steprail .pp-sticky{position:static!important}
    .pp-stepside .pp-sticky{position:static!important}
    .pp-picks{grid-template-columns:1fr 1fr}
  }
  @media(max-width:560px){.pp-picks{grid-template-columns:1fr}}
  `;
  document.head.appendChild(s);
})();

function statusMeta(key){
  const m = {
    submitted:    {label:'In review',       tone:'gold'},
    under_review: {label:'In review',       tone:'gold'},
    pending_info: {label:'Needs your input',tone:'clay'},
    pam_approved: {label:'Funded',          tone:'sage'},
    approved:     {label:'Funded',          tone:'sage'},
    upcoming:     {label:'Funded · upcoming',tone:'sage'},
    executed:     {label:'Ready to claim',  tone:'gold'},
    payout_pending:{label:'Claim in review',tone:'gold'},
    paid:         {label:'Reimbursed',      tone:'sage'},
    rejected:     {label:'Not approved',    tone:'muted'},
    draft:        {label:'Draft',           tone:'muted'},
  };
  return m[key] || {label:key, tone:'muted'};
}

function PPFund({go, route}){
  const b = PARTNER.budget;
  const [step,setStep] = React.useState(1);
  const [saved,setSaved] = React.useState(false);
  // fRef holds ALL form values. Text inputs write here directly (no re-render).
  // Only chip/select/file changes call bump() to trigger a re-render.
  const fRef = React.useRef({
    type: (route.params&&route.params.type)||null,
    name:'', format:'', evType:'', participation:'', date:'', location:'',
    attendees:'', total:'', pct:null, desc:'',
    territory:'', industries:[], icp:'', files:[],
  });
  const [tick,setTick] = React.useState(0);
  const bump = ()=>setTick(t=>t+1);

  React.useEffect(()=>{ if(route.params&&route.params.type){ fRef.current.type=route.params.type; setStep(2); } },[]);

  const f = fRef.current;
  // setChoice: for chips, dropdowns, file list — needs a re-render
  const setChoice = (k,v)=>{ fRef.current[k]=v; bump(); };
  const toggleInd = (v)=>{ const arr=f.industries; fRef.current.industries=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]; bump(); };
  const saveDraft = ()=>{ setSaved(true); setTimeout(()=>setSaved(false),2400); };

  const typeMeta = ACT_TYPES.find(t=>t.id===f.type);
  const pcts = COFUND_BY_TYPE[f.type]||[30,50];
  const total = parseFloat(f.total)||0;
  const requested = f.pct? Math.round(total*f.pct/100):0;
  const remaining = b.available - requested;
  const over = requested>b.available;

  const detailsValid = f.name.trim() && f.date && (f.type!=='event' || (f.format && f.evType));
  const stepValid = {1:!!f.type, 2:!!detailsValid, 3:(total>0 && !!f.pct), 4:true}[step];
  const STEPS = [
    {n:1, t:'What are you planning?', s:'Pick an activity'},
    {n:2, t:'Tell us about it', s:'A few details'},
    {n:3, t:'Funding request', s:'How much you need'},
    {n:4, t:'Review & submit', s:'Confirm & send'},
  ];
  const next = ()=> step<4? setStep(step+1) : go('success',{name:f.name,fund:requested,type:f.type});

  // Opts uses setChoice — chip clicks always need re-render, no focus concern
  const Opts = ({field, list})=>(
    <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
      {list.map(o=>(<button key={o.v||o} className={'pp-opt'+(f[field]===(o.v||o)?' is-sel':'')} onClick={()=>setChoice(field,o.v||o)}>{o.l||o}</button>))}
    </div>
  );

  return (
    <div className="pp-wrap" style={{paddingTop:36,paddingBottom:70}}>
      <button className="pp-link" style={{marginBottom:14}} onClick={()=>go('home')}>← Back to home</button>
      <div className="pp-eyebrow" style={{color:EDI.gold,marginBottom:10}}>New funding plan</div>
      <h1 className="pp-serif pp-h1" style={{fontSize:40,fontWeight:500,letterSpacing:'-.015em',margin:'0 0 6px'}}>Fund a Marketing Activity</h1>
      <p style={{fontSize:16,color:EDI.sub,maxWidth:560,marginBottom:30}}>Tell us what you're planning. We'll show you exactly how much Zoho can co-invest as you go — and you can save and finish later.</p>

      <div className="pp-stepwrap">
        {/* LEFT — step rail */}
        <div className="pp-steprail">
          <div className="pp-sticky">
            {STEPS.map((s,i)=>{ const active=step===s.n, done=s.n<step;
              return (
              <button key={s.n} onClick={()=> (done||s.n<step)&&setStep(s.n)} disabled={s.n>step}
                style={{display:'flex',gap:13,alignItems:'flex-start',width:'100%',textAlign:'left',background:'none',border:'none',cursor:s.n<=step?'pointer':'default',padding:'0 0 22px',position:'relative',fontFamily:EDI.sans}}>
                {i<STEPS.length-1 && <div style={{position:'absolute',left:14,top:30,bottom:0,width:2,background:done?EDI.clay:EDI.line}}/>}
                <div style={{width:29,height:29,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,zIndex:1,
                  background:done?EDI.clay:active?'#fff':'#fff',color:done?'#fff':active?EDI.clay:EDI.faint,
                  border:`2px solid ${done||active?EDI.clay:EDI.line}`,boxShadow:active?`0 0 0 4px ${EDI.redL}`:'none'}}>{done?'✓':s.n}</div>
                <div style={{paddingTop:2}}>
                  <div style={{fontSize:13.5,fontWeight:active?700:600,color:s.n<=step?EDI.ink:EDI.faint,lineHeight:1.3}}>{s.t}</div>
                  <div style={{fontSize:11.5,color:EDI.faint,marginTop:3,lineHeight:1.3}}>{s.s}</div>
                </div>
              </button>
            );})}
          </div>
        </div>

        {/* CENTER — active step */}
        <div className="pp-stepbody">
          {step===1 && (
            <div>
              <h2 className="pp-serif" style={{fontSize:25,fontWeight:500,margin:'0 0 18px'}}>What are you planning?</h2>
              <div className="pp-picks">
                {ACT_TYPES.map(t=>(
                  <button key={t.id} className={'pp-pick'+(f.type===t.id?' is-sel':'')} disabled={t.soon}
                    onClick={()=>!t.soon&&set('type',t.id)} style={{opacity:t.soon?.5:1,position:'relative'}}>
                    {t.soon&&<span style={{position:'absolute',top:14,right:14,fontSize:10.5,fontWeight:700,color:EDI.faint,background:'#EFEADF',padding:'2px 8px',borderRadius:5}}>Coming soon</span>}
                    <div style={{fontSize:26,marginBottom:10,color:f.type===t.id?EDI.clay:EDI.gold}}>{t.icon}</div>
                    <div className="pp-serif" style={{fontSize:19,fontWeight:500}}>{t.title}</div>
                    <div style={{fontSize:13,color:EDI.sub,marginTop:4,lineHeight:1.45}}>{t.sub}</div>
                    <div style={{fontSize:12,fontWeight:700,color:f.type===t.id?EDI.clay:EDI.gold,marginTop:10}}>{t.cofund} co-funded</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {step===2 && (
            <div>
              <h2 className="pp-serif" style={{fontSize:25,fontWeight:500,margin:'0 0 4px'}}>Tell us about it</h2>
              <p style={{fontSize:14,color:EDI.sub,margin:'0 0 22px'}}>A few details so {PARTNER.pam.split(' ')[0]} can say yes quickly.</p>
              <div className="pp-card" style={{padding:24}}>
                <div className="pp-f2">
                  <FundField label={f.type==='gtm'?'Campaign name':f.type==='webinar'?'Webinar title':'Activity name'}>
                    <input className="pp-input" defaultValue={f.name} placeholder={f.type==='gtm'?'e.g. Healthcare Vertical Play':'e.g. Montréal SMB Tech Expo'} onBlur={e=>{fRef.current.name=e.target.value;}} onInput={e=>{fRef.current.name=e.target.value;}}/>
                  </FundField>
                  {f.type==='event' && <>
                    <FundField label="Format" half><Opts field="format" list={['In-person','Online','Hybrid']}/></FundField>
                    <FundField label="Event type" half><Opts field="evType" list={['Self-hosted','Third-party']}/></FundField>
                    {f.evType==='Third-party' && <FundField label="Your role"><Opts field="participation" list={['Organizer','Sponsor','Exhibitor','Speaker']}/></FundField>}
                  </>}
                  {f.type==='webinar' && <FundField label="Promotion" half><Opts field="format" list={['Organic only','Paid promotion']}/></FundField>}
                  {f.type==='gtm' && <>
                    <FundField label="Territory focus" half><input className="pp-input" defaultValue={f.territory} placeholder="e.g. Québec" onInput={e=>{fRef.current.territory=e.target.value;}}/></FundField>
                    <FundField label="Industry focus"><div style={{display:'flex',gap:9,flexWrap:'wrap'}}>{['SaaS','Healthcare','Real Estate','Manufacturing','Pro Services'].map(i=>(<button key={i} className={'pp-opt'+(f.industries.includes(i)?' is-sel':'')} onClick={()=>toggleInd(i)}>{i}</button>))}</div></FundField>
                    <FundField label="Ideal customer profile"><textarea className="pp-textarea" defaultValue={f.icp} placeholder="Who are you trying to reach?" onInput={e=>{fRef.current.icp=e.target.value;}}/></FundField>
                  </>}
                  <FundField label={f.type==='gtm'?'Campaign start date':'Date'} half><input className="pp-input" type="date" defaultValue={f.date} onChange={e=>{fRef.current.date=e.target.value; bump();}}/></FundField>
                  {f.type!=='gtm' && <FundField label={f.type==='webinar'?'Expected registrations':'Location'} half>
                    {f.type==='webinar'
                      ? <input className="pp-input" type="number" defaultValue={f.attendees} placeholder="e.g. 250" onInput={e=>{fRef.current.attendees=e.target.value;}}/>
                      : <input className="pp-input" defaultValue={f.location} placeholder="City or venue" onInput={e=>{fRef.current.location=e.target.value;}}/>}
                  </FundField>}
                  <FundField label="What's the goal?" hint="A sentence on how this builds your pipeline helps a lot.">
                    <textarea className="pp-textarea" defaultValue={f.desc} placeholder="What do you want this activity to achieve?" onInput={e=>{fRef.current.desc=e.target.value;}}/>
                  </FundField>
                </div>
              </div>
            </div>
          )}

          {step===3 && (
            <div>
              <h2 className="pp-serif" style={{fontSize:25,fontWeight:500,margin:'0 0 4px'}}>Funding request</h2>
              <p style={{fontSize:14,color:EDI.sub,margin:'0 0 22px'}}>We'll calculate Zoho's share live, on the right.</p>
              <div className="pp-card" style={{padding:24}}>
                <div className="pp-f2">
                  <FundField label="Total activity budget (CAD)" half><input className="pp-input" type="number" defaultValue={f.total} placeholder="0" onInput={e=>{fRef.current.total=e.target.value; bump();}}/></FundField>
                  <FundField label="Zoho co-funding requested" half hint={typeMeta?`${typeMeta.cofund} for ${typeMeta.title.toLowerCase()}.`:''}>
                    <div style={{display:'flex',gap:9}}>{pcts.map(p=>(<button key={p} className={'pp-opt'+(f.pct===p?' is-sel':'')} onClick={()=>set('pct',p)}>{p}%</button>))}</div>
                  </FundField>
                  <FundField label="Supporting documents" hint="Quotes, agendas, media plans — optional but speeds things up.">
                    <button className="pp-btn pp-btn--ghost pp-btn--sm" onClick={()=>setChoice('files',[...f.files,{name:`Document_${f.files.length+1}.pdf`}])}>＋ Attach a file</button>
                    {f.files.length>0 && <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:7}}>{f.files.map((file,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:9,fontSize:13,background:EDI.paperAlt,border:`1px solid ${EDI.line}`,borderRadius:8,padding:'8px 12px'}}>
                        <span style={{color:EDI.clay}}>▣</span><span style={{fontWeight:600}}>{file.name}</span>
                        <button className="pp-link" style={{marginLeft:'auto',fontSize:13}} onClick={()=>setChoice('files',f.files.filter((_,j)=>j!==i))}>Remove</button>
                      </div>))}</div>}
                  </FundField>
                </div>
              </div>
            </div>
          )}

          {step===4 && (
            <div>
              <h2 className="pp-serif" style={{fontSize:25,fontWeight:500,margin:'0 0 4px'}}>Review &amp; submit</h2>
              <p style={{fontSize:14,color:EDI.sub,margin:'0 0 22px'}}>One last look before this goes to {PARTNER.pam}.</p>
              <div className="pp-card" style={{padding:'8px 24px 18px'}}>
                <RvRow l="Activity type" v={typeMeta&&typeMeta.title}/>
                <RvRow l={f.type==='gtm'?'Campaign name':'Activity name'} v={f.name}/>
                {f.type==='event' && <RvRow l="Format" v={[f.format,f.evType,f.participation].filter(Boolean).join(' · ')}/>}
                {f.type==='gtm' && <RvRow l="Industries" v={f.industries.join(', ')}/>}
                <RvRow l={f.type==='gtm'?'Start date':'Date'} v={fmtDate(f.date)}/>
                {f.location && <RvRow l="Location" v={f.location}/>}
                <RvRow l="Total activity budget" v={fmtMoney(total)}/>
                <RvRow l="Co-funding requested" v={f.pct?f.pct+'%':'—'}/>
                <RvRow l="Documents" v={f.files.length?`${f.files.length} attached`:'None'}/>
                <div style={{display:'flex',justifyContent:'space-between',padding:'14px 0 4px'}}>
                  <span style={{fontWeight:700,fontSize:15}}>Funding you're requesting</span>
                  <span className="pp-serif" style={{fontSize:24,fontWeight:500,color:EDI.clay}}>{fmtMoney(requested)}</span>
                </div>
              </div>
            </div>
          )}

          {/* footer controls */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:26,gap:12,flexWrap:'wrap'}}>
            <button className="pp-btn pp-btn--ghost" style={{visibility:step>1?'visible':'hidden'}} onClick={()=>setStep(step-1)}>← Back</button>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              {saved && <span style={{fontSize:13,color:EDI.sage,fontWeight:700}}>✓ Saved — finish anytime</span>}
              <button className="pp-btn pp-btn--soft pp-btn--sm" onClick={saveDraft}>Save &amp; finish later</button>
              <button className="pp-btn pp-btn--clay" disabled={!stepValid} onClick={next}>{step===4?'Request Funding →':'Continue →'}</button>
            </div>
          </div>
        </div>

        {/* RIGHT — live funding rail */}
        <div className="pp-stepside">
          <div className="pp-sticky pp-card" style={{padding:22,boxShadow:'0 14px 40px rgba(80,60,30,.10)'}}>
            <div className="pp-eyebrow" style={{color:EDI.sub,fontSize:11.5,letterSpacing:'.08em',marginBottom:14}}>Your funding, live</div>
            {[['Available growth funds', b.available, EDI.ink],['This request', requested, EDI.clay]].map(([l,v,c])=>(
              <div key={l} style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',padding:'8px 0',borderBottom:`1px solid ${EDI.lineSoft}`}}>
                <span style={{fontSize:13,color:EDI.sub}}>{l}</span>
                <span className="pp-serif" style={{fontSize:20,fontWeight:500,color:c,fontVariantNumeric:'tabular-nums'}}>{fmtMoney(v)}</span>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',padding:'12px 0 4px'}}>
              <span style={{fontSize:13,fontWeight:700}}>Remaining after approval</span>
              <span className="pp-serif" style={{fontSize:23,fontWeight:500,color:over?EDI.red:EDI.sage,fontVariantNumeric:'tabular-nums'}}>{fmtMoney(remaining)}</span>
            </div>
            {f.pct && total>0 && <div style={{fontSize:12,color:EDI.sub,marginTop:6}}>You contribute {fmtMoney(total-requested)} · Zoho co-funds {f.pct}%</div>}
            {over && <div style={{background:EDI.redL,border:`1px solid ${EDI.line}`,borderRadius:10,padding:'10px 13px',fontSize:12,color:EDI.clayD,marginTop:13,lineHeight:1.5}}>This is more than your available funds. You can still submit — {PARTNER.pam.split(' ')[0]} will review before approving.</div>}
            <div style={{display:'flex',gap:9,alignItems:'flex-start',marginTop:16,fontSize:12,color:EDI.sub,lineHeight:1.5}}>
              <span style={{color:EDI.gold,fontSize:14,lineHeight:1}}>✦</span>
              <span><strong style={{color:EDI.ink}}>What's next:</strong> {PARTNER.pam} reviews within 5 business days. We'll help you make it land.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
window.PPFund = PPFund;

function PPPrograms({go}){

    all:()=>true,

    funded:a=>['approved','upcoming'].includes(a.status),
    action:a=>['pending_info','executed','rejected'].includes(a.status),
    done:a=>a.status==='paid',
  };
  const chips = [['all','All'],['review','In review'],['funded','Funded'],['action','Needs you'],['done','Completed']];
  const list = ACTIVITIES.filter(groups[filter]);
  const counts = {}; chips.forEach(([k])=> counts[k]=ACTIVITIES.filter(groups[k]).length);

  return (
    <div className="pp-wrap" style={{paddingTop:46,paddingBottom:64}}>
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:22}}>
        <div>
          <div className="pp-eyebrow" style={{color:EDI.clay,marginBottom:12}}>My programs</div>
          <h1 className="pp-serif pp-h1" style={{fontSize:40,fontWeight:500,letterSpacing:'-.015em',margin:0}}>Every plan, in one place</h1>
        </div>
        <button className="pp-btn pp-btn--clay" onClick={()=>go('fund')}>Fund a Marketing Activity →</button>
      </div>

      <div style={{display:'flex',gap:9,flexWrap:'wrap',marginBottom:20}}>
        {chips.map(([k,l])=>(
          <button key={k} className={'pp-opt'+(filter===k?' is-sel':'')} onClick={()=>setFilter(k)}>{l} <span style={{opacity:.6,marginLeft:4}}>{counts[k]}</span></button>
        ))}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {list.map(a=>{ const sm=statusMeta(a.status); const needs = a.status==='pending_info'||a.status==='executed';
          return (
          <div key={a.id} className="pp-card pp-clickable" onClick={()=>go('activity',{id:a.id})} style={{padding:'22px 26px',display:'grid',gridTemplateColumns:'1fr auto',gap:18,alignItems:'center',borderLeft:needs?`3px solid ${EDI.gold}`:`1px solid ${EDI.line}`}}>
            <div style={{minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6,flexWrap:'wrap'}}>
                <span className={'pp-tag pp-tag--'+sm.tone}>{sm.label}</span>
                <span style={{fontSize:12.5,color:EDI.faint,fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em'}}>{a.typeLabel}</span>
              </div>
              <div className="pp-serif" style={{fontSize:22,fontWeight:500,letterSpacing:'-.01em'}}>{a.title}</div>
              <div style={{fontSize:13.5,color:EDI.sub,marginTop:4}}>{[a.format,(a.location&&!a.format.includes(a.location))?a.location:null,fmtDate(a.date)].filter(Boolean).join(' · ')}</div>
              {a.status==='pending_info' && <div style={{fontSize:13,color:EDI.clayD,fontWeight:600,marginTop:8}}>Daniel needs a little more info to move forward →</div>}
              {a.status==='executed' && <div style={{fontSize:13,color:EDI.goldD,fontWeight:600,marginTop:8}}>Ready to claim up to {fmtMoney(a.claimMax)} →</div>}
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:11.5,color:EDI.faint,fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em'}}>{a.status==='paid'?'Reimbursed':'Zoho co-fund'}</div>
              <div className="pp-serif" style={{fontSize:26,fontWeight:500,fontVariantNumeric:'tabular-nums',color:a.status==='rejected'?EDI.faint:EDI.ink}}>{fmtMoney(a.status==='paid'?a.reimbursed:a.fund)}</div>
            </div>
          </div>
        );})}
      </div>
    </div>
  );
}

                <button className="pp-btn pp-btn--ghost pp-btn--sm">＋ Attach media plan</button>

          <div><div style={{fontWeight:700,fontSize:14.5}}>Thanks — sent to Daniel.</div><div style={{fontSize:13.5,color:EDI.sub}}>He'll review and you'll hear back within 2 business days.</div></div>

          <div><div className="pp-serif" style={{fontSize:20,fontWeight:500,color:EDI.clayD}}>Not approved this time</div><p style={{fontSize:14.5,color:'#7A3322',lineHeight:1.6,margin:'6px 0 0'}}>{a.rejectionReason}</p></div>

          {/* funding summary */}

function App(){

  const go = (name,params={})=>{ setRoute({name,params}); window.scrollTo({top:0,behavior:'auto'}); };
  const screens = { home:PPHome, fund:PPFund, success:PPSuccess, programs:PPPrograms, activity:PPActivity, claims:PPClaims, budget:PPBudget, help:PPHelp };

  return (
    <PPShell route={route} go={go}>

}
