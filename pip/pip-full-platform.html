<script type="text/babel">/* ─────────────────────────────────────────────────────────────
 * Partner Intelligence v3 — narrative dominant, numbers recede
 * Intelligence Summary = primary artifact.
 * Score = compression artifact, visually secondary.
 * Trajectory = explicit, momentum-language everywhere.
 * KPI strip reduced to 3 cells.
 * ───────────────────────────────────────────────────────────── */

/* ── Use trajectory primitives from window (defined in traj_prims script) ── */
const momentum      = window.momentum      || ((s,d) => ({ label:"Stable", dir:"flat", color:"var(--ink-4)", velocity:0, accelerating:false, decelerating:false }));
const trajectoryUrgency = window.trajectoryUrgency || (() => 0);
const MomentumTag   = window.MomentumTag   || (() => null);
const EcosystemMomentumBar = window.EcosystemMomentumBar || (() => null);
const TrajectoryCard = window.TrajectoryCard || (() => null);

/* ── BandPill ── */
const BandPill = ({ label, color, soft, bd }) => (
  <span style={{ display:"inline-flex", alignItems:"center", padding:"2px 9px", borderRadius:100,
    background:soft, border:`1px solid ${bd}`, fontSize:11, fontWeight:500, color, whiteSpace:"nowrap" }}>
    {label}
  </span>
);

Object.assign(window, { OperationalSummary: window.OperationalSummary, SignalProvenance: window.SignalProvenance });

const Tip = ({d,r,l}) => <i className={`tip${r?" tip-right":l?" tip-left":""}`} data-tip={d}>i</i>;

/* ── maturityBand ── */
const maturityBand = (pct) => {
  if (pct >= 85) return { label:"Excellent",        color:"var(--green)",  soft:"var(--green-soft)",  bd:"var(--green-bd)" };
  if (pct >= 70) return { label:"Strong",           color:"var(--green)",  soft:"var(--green-soft)",  bd:"var(--green-bd)" };
  if (pct >= 55) return { label:"Healthy",          color:"var(--ink-2)",  soft:"var(--surface-3)",   bd:"var(--border)" };
  if (pct >= 40) return { label:"Attention Needed", color:"var(--amber)",  soft:"var(--amber-soft)",  bd:"var(--amber-bd)" };
  return              { label:"Below Benchmark",    color:"var(--red)",    soft:"var(--red-soft)",    bd:"var(--red-bd)" };
};

/* ── ZohoMaturityScore (same logic, trajectory added) ── */
const ZohoMaturityScore = ({ partner }) => {
  const growth    = partner.growth;
  const revGrowthPts = Math.round(Math.max(0, Math.min(400, 200 + growth * 15)));
  const newCustPts   = Math.round(Math.max(0, Math.min(100, partner.customers / 2.5)));
  const revTotal  = revGrowthPts + newCustPts;
  const crrPts    = Math.round(Math.min(100, partner.crr));
  const csatPts   = Math.round(Math.min(100, partner.csat * 20));
  const certPts   = Math.round(Math.min(100, partner.certifications.active * 100 / 44));
  const escPenalty = Math.min(100, partner.escalations.open * 14);
  const csTotal   = crrPts + csatPts + certPts - escPenalty;
  const projPts   = Math.round(Math.min(50, partner.health > 70 ? 25 : 10));
  const csPts     = Math.round(Math.min(50, partner.health > 70 ? 15 : 5));
  const mrTotal   = projPts + csPts;
  const practPts  = 25;
  const brandPts  = Math.round(Math.min(75, partner.health > 70 ? 50 : partner.health > 50 ? 25 : 10));
  const engTotal  = practPts + brandPts;
  const totalScore = Math.min(1000, revTotal + csTotal + mrTotal + engTotal);
  const overallBand = maturityBand(totalScore / 10);

  const trendIcon = (t) => t === "up"
    ? <span style={{ color:"var(--green)", fontSize:10, fontWeight:700 }}>↑ Improving</span>
    : t === "down"
    ? <span style={{ color:"var(--red)",   fontSize:10, fontWeight:700 }}>↓ Declining</span>
    : <span style={{ color:"var(--ink-3)", fontSize:10 }}>→ Stable</span>;

  const components = [
    { name:"Commercial Health", icon:"◈", total:revTotal, max:500,
      trend:growth >= 5 ? "up" : growth >= 0 ? "stable" : "down",
      interpretation:growth >= 5
        ? "Revenue momentum positive. Customer acquisition velocity above regional baseline."
        : growth >= 0
        ? "Revenue stable. New customer acquisition velocity has slowed versus prior year."
        : "Revenue contracting. Both acquisition and expansion ARR need attention.",
      tip:"Revenue Growth (max 400pts): ARR growth velocity vs prior year.\nNew Customers YTD (max 100pts): net new logos this year.",
      subs:[
        { name:"Revenue Growth",    val:revGrowthPts, max:400, tip:"Year-over-year ARR growth. Higher = more points." },
        { name:"New Customers YTD", val:newCustPts,   max:100, tip:"Net new customer logos this calendar year. Source: CRM." },
      ] },
    { name:"Customer Success", icon:"◉", total:Math.max(0,csTotal), max:300,
      trend:partner.crr >= 93 ? "up" : partner.crr >= 85 ? "stable" : "down",
      interpretation:partner.crr >= 93
        ? `Retention ranks among top-tier ${partner.tier} partners in ${partner.region}. Certification coverage fully supports current scale.`
        : partner.crr >= 85
        ? "Customer retention healthy. Certification density near baseline — monitor expiring certs."
        : "Retention below benchmark. Escalation volume is weighing on Customer Success.",
      tip:"CRR (100pts) + CSAT (100pts) + Certifications (100pts) − Escalation penalty (up to −100pts).\nSource: Desk + Renewals + Cert records.",
      subs:[
        { name:"CRR",            val:crrPts,      max:100, tip:"CRR % scored 0–100." },
        { name:"CSAT",           val:csatPts,     max:100, tip:"Customer satisfaction × 20. CSAT 4.3/5 = 86 points." },
        { name:"Certifications", val:certPts,     max:100, tip:"Active certifications as % of benchmark (44)." },
        { name:"Escalations",    val:-escPenalty, max:0,   tip:"Penalty: each open escalation deducts points. SLA breaches carry higher weight." },
      ] },
    { name:"Market Readiness", icon:"◇", total:mrTotal, max:100,
      trend:mrTotal >= 60 ? "up" : mrTotal >= 30 ? "stable" : "down",
      interpretation:mrTotal >= 60
        ? "Implementation depth and case study portfolio well-developed. Supports enterprise deals."
        : mrTotal >= 30
        ? "Implementation projects active but case study documentation lagging. Limits reference-selling."
        : "Market Readiness is the primary gap. No published case studies reduces tier progression potential.",
      tip:"Projects (max 50pts): verified implementation projects.\nCase Studies (max 50pts): published with customer approval.",
      subs:[
        { name:"Implementation Projects", val:projPts, max:50, tip:"Verified implementation projects on record." },
        { name:"Case Studies",            val:csPts,   max:50, tip:"Published, customer-approved case studies." },
      ] },
    { name:"Zoho Engagement", icon:"◎", total:engTotal, max:100,
      trend:engTotal >= 70 ? "up" : engTotal >= 40 ? "stable" : "down",
      interpretation:engTotal >= 70
        ? "Practice size strong and co-marketing participation active. Ecosystem contribution above cohort."
        : engTotal >= 40
        ? "Practice size established but branding participation is below Premium tier norms."
        : "Engagement below benchmark. Branding and campaign activity need investment to support tier standing.",
      tip:"Practice Size (max 25pts): certified consultants active in Zoho practice.\nBranding & Campaigns (max 75pts): co-marketing, events, branded activities.",
      subs:[
        { name:"Zoho Practice Size",   val:practPts, max:25, tip:"Team members actively engaged in Zoho practice." },
        { name:"Branding & Campaigns", val:brandPts, max:75, tip:"Co-marketing participation: events, branded activities, webinars." },
      ] },
  ];

  const [expanded, setExpanded] = React.useState(null);

  return (
    <section className="card">
      <header className="card-head">
        <div>
          <div className="card-title">
            Partner Maturity Profile
            <Tip d={"Official Zoho Partner Score — 1000 points total.\nFour components: Commercial Health, Customer Success, Market Readiness, Zoho Engagement.\nDetermines tier standing. ~500 = Standard, ~750 = Premium.\nPIP tracks signals that predict where this will land next annual cycle."} />
          </div>
          <div className="card-sub">Zoho official model · 1000pt scale · tier-determining · click rows to expand</div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:10, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-3)", marginBottom:2, display:"flex", alignItems:"center", gap:4, justifyContent:"flex-end" }}>
              Overall <i className="tip tip-left" data-tip={"Total Zoho Partner Score out of 1000.\nSum of all four components.\nDetermines tier standing: ~500 = Standard threshold, ~750 = Premium threshold.\nPIP tracks signals that predict where this will land next annual cycle."}>i</i>
            </div>
            <div style={{ display:"flex", alignItems:"baseline", gap:4 }}>
              <span style={{ fontFamily:"var(--font-mono)", fontSize:20, fontWeight:500, color:overallBand.color }}>{totalScore}</span>
              <span style={{ fontFamily:"var(--font-mono)", fontSize:11, color:"var(--ink-4)" }}>/1000</span>
            </div>
          </div>
          <BandPill label={overallBand.label} color={overallBand.color} soft={overallBand.soft} bd={overallBand.bd} />
        </div>
      </header>

      {/* Tier progress */}
      <div style={{ padding:"10px 14px 0", borderBottom:"1px solid var(--border)" }}>
        <div style={{ position:"relative", height:6, background:"var(--surface-3)", borderRadius:6 }}>
          <div style={{ height:"100%", width:`${totalScore/10}%`, background:overallBand.color, borderRadius:6, transition:"width .5s" }} />
          {[{ pct:50, label:"Standard" }, { pct:75, label:"Premium" }].map(mk => (
            <div key={mk.label} style={{ position:"absolute", top:-2, left:`${mk.pct}%`, transform:"translateX(-50%)", width:2, height:10, background:"var(--border-2)", borderRadius:1 }}>
              <span style={{ position:"absolute", top:12, left:"50%", transform:"translateX(-50%)", fontSize:9, color:"var(--ink-4)", fontFamily:"var(--font-mono)", whiteSpace:"nowrap" }}>{mk.label}</span>
            </div>
          ))}
        </div>
        <div style={{ height:18 }} />
      </div>

      {/* Components — interpretation first, band label prominent, numbers secondary */}
      {components.map((comp,ci) => {
        const pct  = Math.max(0, comp.total / comp.max * 100);
        const band = maturityBand(pct);
        const open = expanded === ci;
        return (
          <div key={ci} style={{ borderBottom:"1px solid var(--border)" }}>
            <div onClick={() => setExpanded(open ? null : ci)}
              style={{ display:"grid", gridTemplateColumns:"20px 1fr auto auto", gap:10, padding:"11px 14px", cursor:"pointer", alignItems:"flex-start" }}>
              <span style={{ fontSize:13, color:band.color, paddingTop:1 }}>{comp.icon}</span>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:7, marginBottom:3 }}>
                  <span style={{ fontSize:12, fontWeight:600, color:"var(--ink)" }}>{comp.name}</span>
                  <Tip d={comp.tip} />
                  {trendIcon(comp.trend)}
                </div>
                <div style={{ fontSize:12, color:"var(--ink-3)", lineHeight:1.5, maxWidth:440 }}>{comp.interpretation}</div>
              </div>
              <BandPill label={band.label} color={band.color} soft={band.soft} bd={band.bd} />
              {/* Score — visually secondary */}
              <div style={{ textAlign:"right", minWidth:56, opacity:.7 }}>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:12, fontWeight:600, color:band.color }}>{Math.max(0,comp.total)}</span>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:9.5, color:"var(--ink-4)" }}>/{comp.max}</span>
                <Icon name={open ? "chevron-down" : "chevron-right"} size={10} style={{ marginLeft:4, color:"var(--ink-4)" }} />
              </div>
            </div>
            {open && (
              <div style={{ background:"var(--surface-2)", borderTop:"1px solid var(--border)" }}>
                <div style={{ padding:"6px 14px 2px 44px", fontSize:10, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-4)" }}>How this was computed</div>
                {comp.subs.map((sub,si) => {
                  const subPct  = sub.max > 0 ? sub.val / sub.max * 100 : 0;
                  const subBand = sub.val < 0 ? { color:"var(--red)" } : maturityBand(subPct);
                  return (
                    <div key={si} style={{ display:"grid", gridTemplateColumns:"1fr 80px 90px 50px", gap:10, padding:"7px 14px 7px 44px", borderTop:si>0?"1px solid var(--border)":"none", alignItems:"center" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                        <span style={{ fontSize:12, color:"var(--ink-2)" }}>{sub.name}</span>
                        <Tip d={sub.tip} />
                      </div>
                      <span style={{ fontFamily:"var(--font-mono)", fontSize:10.5, color:"var(--ink-4)", textAlign:"right" }}>{sub.max > 0 ? `max ${sub.max}` : "penalty"}</span>
                      <div style={{ height:3, background:"var(--surface-3)", borderRadius:3, overflow:"hidden" }}>
                        {sub.val >= 0 && <div style={{ height:"100%", width:`${Math.min(100,subPct)}%`, background:subBand.color }} />}
                      </div>
                      <div style={{ textAlign:"right", fontFamily:"var(--font-mono)", fontSize:12, fontWeight:600, color:subBand.color }}>{sub.val > 0 ? "+" : ""}{sub.val}</div>
                    </div>
                  );
                })}
                <div style={{ display:"flex", justifyContent:"space-between", padding:"7px 14px 8px 44px", borderTop:"1px dashed var(--border-2)" }}>
                  <span style={{ fontSize:11, color:"var(--ink-3)" }}>Component total</span>
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:12, fontWeight:600, color:band.color }}>{Math.max(0,comp.total)}/{comp.max}</span>
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* Benchmarks */}
      <div style={{ padding:"10px 14px", background:"var(--surface-2)" }}>
        <div style={{ fontSize:10, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-3)", marginBottom:7, display:"flex", alignItems:"center", gap:4 }}>
          Benchmark Intelligence
          <Tip d={"Anonymous comparison against partners at the same tier and region.\nSource: Analytics daily sync — individual partner data is never shared.\nPercentile positions recomputed quarterly."} />
        </div>
        {[
          partner.crr >= 93
            ? { text:`CRR top 15% among ${partner.tier} partners in ${partner.region}.`, good:true }
            : { text:`CRR below ${partner.tier} tier median in ${partner.region}.`, good:false },
          partner.certifications.ratio >= 0.85
            ? { text:"Certification density above peer cohort for declared practices.", good:true }
            : { text:"Certification density below peer cohort. Expiring certs accelerate the gap.", good:false },
          partner.growth >= 5
            ? { text:"Revenue growth outpacing regional average this quarter.", good:true }
            : { text:"Revenue growth below regional average. Expansion velocity needs attention.", good:false },
        ].map((bm,i) => (
          <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:8, fontSize:12, color:"var(--ink-2)", marginBottom:i<2?5:0 }}>
            <span className={`dot ${bm.good ? "green" : "amber"}`} style={{ marginTop:4, flexShrink:0 }} />
            {bm.text}
          </div>
        ))}
      </div>
      <div style={{ padding:"7px 14px", borderTop:"1px solid var(--border)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <span style={{ fontSize:10.5, color:"var(--ink-4)", fontFamily:"var(--font-mono)" }}>Sources: CRM · Store · Desk · Renewals · Cert · Campaigns · Analytics</span>
        <button className="btn sm ghost" style={{ fontSize:10.5 }}><Icon name="shield" size={10} /> Audit trail</button>
      </div>
    </section>
  );
};

/* ── Sub-score band label (replaces number as primary) ── */
const subBandLabel = (v) => {
  if (v >= 80) return { label:"Strong",           color:"var(--green)" };
  if (v >= 65) return { label:"Healthy",          color:"var(--ink-2)" };
  if (v >= 50) return { label:"Attention Needed", color:"var(--amber)" };
  return              { label:"Below Benchmark",  color:"var(--red)" };
};

/* ── Partner Intelligence main ── */
const PartnerIntelligence = ({ partner, onBack, onOpenCliq, escalations, tweaks }) => {
  if (!partner) return null;
  const initials = partner.name.split(/\s+/).slice(0,2).map(w=>w[0]).join("");
  const b = bandClass(partner.health);
  const myEsc = escalations.filter(e => e.partner === partner.name);
  const baseline = partner.sparkHealth.map((v,i) => 72 + Math.sin(i/2)*2);
  const m = momentum(partner.sparkHealth, partner.healthDelta);

  /* 3-cell KPI strip */
  const kpiCells = [
    { l:"ARR at Risk",    tip:"Renewal-stage overdue ARR + escalation-flagged ARR.\nNot churn — current exposure requiring action.",
      v:partner.arrAtRiskFmt, s:"renewal + review-stage", color:"red" },
    { l:"CRR",            tip:"Customer Retention Rate.\nFormula: renewed ÷ up for renewal × 100.\nFeeds Customer Success component of Partner Score.",
      v:`${partner.crr}%`, s:"+0.3 QoQ · "+( partner.crr >= 93 ? "top 15% in region" : "near tier median"), color:partner.crr>=93?"green":"" },
    { l:"Growth",         tip:"Trailing 12-month ARR growth rate.\nFeeds Commercial Health component of Partner Score.",
      v:`${partner.growth>=0?"+":""}${partner.growth}%`, s:"trailing 12m · "+m.label.toLowerCase(), color:partner.growth>=0?"green":"red" },
  ];

  const subs = [
    { key:"financial",   name:"Commercial Stability",    desc:"Revenue + renewal reliability",         trend:partner.arrDelta>=5?"up":partner.arrDelta>=0?"stable":"down" },
    { key:"operational", name:"Operational Reliability", desc:"Tickets + escalation discipline",       trend:partner.escalations.sla==="green"?"up":partner.escalations.sla==="red"?"down":"stable" },
    { key:"delivery",    name:"Delivery Capability",     desc:"Certifications + implementation depth", trend:partner.certifications.expiring>5?"down":partner.certifications.ratio>.85?"up":"stable" },
    { key:"engagement",  name:"Ecosystem Participation", desc:"Campaigns + advocacy + marketplace",    trend:"stable" },
    { key:"momentum",    name:"Growth Momentum",         desc:"ARR velocity + customer acquisition",   trend:partner.growth>=5?"up":partner.growth>=0?"stable":"down" },
    { key:"renewal",     name:"Renewal Continuity",      desc:"Auto-renew rate + review-stage health", trend:partner.renewals.autoRate>=0.8?"up":partner.renewals.autoRate>=0.65?"stable":"down" },
  ];

  const trendMark = (t) => t==="up"
    ? <span style={{ color:"var(--green)", fontSize:10, marginLeft:4 }}>↑</span>
    : t==="down"
    ? <span style={{ color:"var(--red)",   fontSize:10, marginLeft:4 }}>↓</span>
    : <span style={{ color:"var(--ink-4)", fontSize:10, marginLeft:4 }}>→</span>;

  return (
    <div className="p360">
      <div className="col main">

        {/* SNAPSHOT HEADER — minimal */}
        <header className="p360-snap">
          <button className="btn sm ghost" onClick={onBack} style={{ marginBottom:10 }}>
            <Icon name="chevron-right" size={11} style={{ transform:"rotate(180deg)" }} />
            Back to Portfolio
          </button>

          <div className="p360-snap-top">
            <div className="p360-id">
              <div className="p360-avatar">{initials}</div>
              <div>
                <div className="p360-name">{partner.name}</div>
                <div className="p360-sub">
                  <span>{partner.country}</span><span>·</span>
                  <span>{partner.tenure} tenure</span><span>·</span>
                  <span>PAM: {partner.pam}</span>
                </div>
                <div className="p360-tags" style={{ marginTop:6 }}>
                  <Chip tone="violet">{partner.tier}</Chip>
                  <Chip tone="green">Active</Chip>
                  <Chip>{partner.region}</Chip>
                  {partner.practices.map(pr => <Chip key={pr}>{pr}</Chip>)}
                </div>
              </div>
            </div>

            {/* Scores — right rail, visually secondary, opacity reduced */}
            <div style={{ display:"flex", gap:18, alignItems:"flex-start", flexShrink:0 }}>
              <div style={{ textAlign:"right", opacity:.85 }}>
                <div style={{ fontSize:9.5, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-3)", marginBottom:2 }}>
                  PIP Health <Tip d={"Real-time operational health score, 0–100.\nComputed by Catalyst from live signals.\nPredicts where the Zoho Partner Score will trend next cycle."} />
                </div>
                <div style={{ display:"flex", alignItems:"baseline", gap:6, justifyContent:"flex-end" }}>
                  <span className={`p360-score-v ${b}`} style={{ fontSize:30 }}>{partner.health}</span>
                  <MomentumTag spark={partner.sparkHealth} delta={partner.healthDelta} />
                </div>
                <div className={`p360-score-band ${b}`} style={{ fontSize:10.5 }}>{bandLabel(partner.health)}</div>
              </div>
              <div style={{ width:1, background:"var(--border)", alignSelf:"stretch" }} />
              <div style={{ textAlign:"right", opacity:.75 }}>
                <div style={{ fontSize:9.5, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-3)", marginBottom:2 }}>
                  Partner Score <Tip d={"Official Zoho partner score out of 1000.\nDetermines tier standing.\nSee Partner Maturity Profile below for full breakdown."} />
                </div>
                <div style={{ display:"flex", alignItems:"baseline", gap:3, justifyContent:"flex-end" }}>
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:22, fontWeight:400, color:"var(--ink)" }}>{Math.round(partner.health*8.2+50)}</span>
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:11, color:"var(--ink-4)" }}>/1000</span>
                </div>
                <div style={{ fontSize:10.5, color:"var(--ink-3)" }}>Annual · tier-determining</div>
              </div>
            </div>
          </div>

          {/* 3-cell KPI strip */}
          <div className="p360-kpi" style={{ gridTemplateColumns:"repeat(3,1fr)" }}>
            {kpiCells.map((c,i) => (
              <div key={i} className="cell">
                <div className="l">{c.l} <Tip d={c.tip} /></div>
                <div className={`v${c.color ? " "+c.color : ""}`}>{c.v}</div>
                <div className="s">{c.s}</div>
              </div>
            ))}
          </div>
        </header>

        {/* ── DOMINANT ZONE — Intelligence Summary ── */}
        <OperationalSummary partner={partner} />

        {/* Signal interpretation */}
        <PIPInterpretation partner={partner} />

        {/* Body grid */}
        <div className="p360-body">
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

            {/* Why Changed */}
            <section className="card">
              <header className="card-head">
                <div className="card-title">
                  Why Changed
                  <Tip d={"Specific signals from the last 30 days that moved the score.\nDirect cause-effect mappings from the Catalyst event ledger.\nTrace any score change to a specific event."} />
                  <span className="card-title-num">{partner.whyChanged.length}</span>
                </div>
                <div className="card-sub">Signals driving 30d health movement</div>
              </header>
              <div className="card-body flush">
                {partner.whyChanged.map((w,i) => (
                  <div key={i} className={`why-row ${w.level}`}>
                    <span className="why-dim">{w.dim}</span>
                    <span className="why-text">{w.text}</span>
                    <SourceBadge src={w.src} />
                  </div>
                ))}
              </div>
            </section>

            {/* TrajectoryCard — first-class, above Maturity Profile */}
            <TrajectoryCard partner={partner} baseline={baseline} />

            {/* Maturity Profile */}
            <ZohoMaturityScore partner={partner} />

            {/* Operational Health — band labels lead, numbers secondary */}
            <section className="card">
              <header className="card-head">
                <div className="card-title">
                  Operational Health · Real-time
                  <Tip d={"PIP's 6-dimension health model — separate from the official Partner Score.\nComputed continuously from live signals.\nBand labels (Strong, Healthy, Attention Needed) are the primary signal.\nNumbers and weights visible in the Score Composition rail on the right."} />
                </div>
                <div className="card-sub">Live signals · band labels lead · numbers secondary</div>
              </header>
              <div className="card-body">
                <div className="sub-grid">
                  {subs.map(s => {
                    const v   = partner.sub[s.key];
                    const bb  = bandClass(v);
                    const sl  = subBandLabel(v);
                    return (
                      <React.Fragment key={s.key}>
                        <div className="sub-row" style={{ borderBottom:"none", padding:"6px 0 4px" }}>
                          <div>
                            <div className="sub-name">
                              {s.name}{trendMark(s.trend)}
                            </div>
                            <div style={{ fontSize:10.5, color:"var(--ink-4)" }}>{s.desc}</div>
                          </div>
                          {/* Band label as primary, number small + faded */}
                          <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:2 }}>
                            <span style={{ fontSize:11, fontWeight:600, color:sl.color }}>{sl.label}</span>
                            <span className={`sub-v ${bb==="green"?"t-green":bb==="amber"?"t-amber":"t-red"}`} style={{ fontSize:10.5, opacity:.55 }}>{v}</span>
                          </div>
                          <div className="sub-bar"><div className={`fill ${bb}`} style={{ width:`${v}%` }} /></div>
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            </section>



            {/* Customer Portfolio — condensed */}
            <section className="card">
              <header className="card-head">
                <div className="card-title">
                  Customer Portfolio
                  <Tip d={"Cross-system risk density for this partner's customer book.\nAt-risk: health score below 60 or renewal overdue.\nExpansion-ready: cross-sell affinity flag in CRM."} />
                  <span className="card-title-num">{partner.customers}</span>
                </div>
              </header>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)" }}>
                {[
                  { l:"At-risk customers", v:partner.customersAtRisk, s:"Review overdue", c:"red" },
                  { l:"Upcoming renewals",  v:partner.renewals.upcoming90d, s:"Next 90 days", c:"" },
                  { l:"Expansion-ready",    v:Math.max(2,Math.floor(partner.customers/18)), s:"Cross-sell eligible", c:"green" },
                ].map((c,i) => (
                  <div key={i} style={{ padding:"12px 16px", borderRight:i<2?"1px solid var(--border)":"none" }}>
                    <div className="label" style={{ marginBottom:4 }}>{c.l}</div>
                    <div className={`mono t-${c.c||"ink"}`} style={{ fontSize:20, fontWeight:500, letterSpacing:"-.02em" }}>{c.v}</div>
                    <div style={{ fontSize:11, color:"var(--ink-3)", marginTop:2 }}>{c.s}</div>
                  </div>
                ))}
              </div>
            </section>

            {/* Coaching */}
            <section className="card">
              <header className="card-head">
                <div className="card-title">
                  Coaching Recommendations
                  <Tip d={"Generated from the partner's weakest scoring dimensions.\nCritical: 4 recommendations. Healthy: 2.\nEach includes estimated impact on Partner Score or ARR."} />
                </div>
              </header>
              <div className="card-body flush">
                {[
                  { t:"Increase Creator certification density",      i:"Closes regional gap · restores Delivery sub-score · +cert pts in Partner Score",  tag:"Customer Success" },
                  { t:"Expand US East coverage",                      i:"2 customers eligible for Books cross-sell · est. +12% ARR",                       tag:"Commercial" },
                  { t:"Reduce Partner-Ops ticket dependency",         i:"Top-3 ticket categories addressable via in-org docs",                              tag:"Operational" },
                  { t:"Publish 1 case study this quarter",           i:"Market Readiness gap: +50pts toward Partner Score · unlocks reference program",    tag:"Market Readiness" },
                ].slice(0, partner.health < 60 ? 4 : 2).map((r,i) => (
                  <div key={i} style={{ display:"grid", gridTemplateColumns:"1fr auto", padding:"11px 16px", borderBottom:"1px solid var(--border)", alignItems:"flex-start", gap:12 }}>
                    <div>
                      <div style={{ fontSize:12.5, fontWeight:500, color:"var(--ink)" }}>{r.t}</div>
                      <div style={{ fontSize:11, color:"var(--ink-3)", marginTop:3 }}>{r.i}</div>
                    </div>
                    <Chip>{r.tag}</Chip>
                  </div>
                ))}
              </div>

<script type="text/babel">/* ─── Ecosystem Risk Heatmap ──────────────────────────────── */
const RiskHeatmap = () => {
  // x-axis: renewal proximity (Q1..>Q4)
  // y-axis: operational maturity (Critical → Excellent)
  // value: ARR at risk in that bucket ($M), color-graded
  const xLabels = ["Q1 (≤30d)", "Q2 (60d)", "Q3 (90d)", "Q4 (180d)", "Q4+"];
  const yLabels = ["Excellent", "Healthy", "Stable", "Watch", "Critical"];
  // grid[y][x] — { arr ($M), partners, region }
  const grid = [
    // Excellent
    [{ arr: 0.0, p: 4, r: "APAC" }, { arr: 0.1, p: 3, r: "EMEA" }, { arr: 0.3, p: 6, r: "APAC" }, { arr: 0.4, p: 8, r: "Americas" }, { arr: 0.5, p: 11, r: "Americas" }],
    // Healthy
    [{ arr: 0.2, p: 5, r: "EMEA" }, { arr: 0.4, p: 7, r: "APAC" }, { arr: 0.8, p: 12, r: "Americas" }, { arr: 1.1, p: 14, r: "Americas" }, { arr: 0.9, p: 9, r: "EMEA" }],
    // Stable
    [{ arr: 0.5, p: 6, r: "EMEA" }, { arr: 0.8, p: 9, r: "Americas" }, { arr: 1.4, p: 13, r: "Americas" }, { arr: 0.9, p: 8, r: "APAC" }, { arr: 0.7, p: 7, r: "LATAM" }],
    // Watch
    [{ arr: 1.2, p: 4, r: "Americas" }, { arr: 1.9, p: 6, r: "Americas" }, { arr: 2.4, p: 7, r: "Americas" }, { arr: 1.6, p: 5, r: "EMEA" }, { arr: 0.8, p: 4, r: "APAC" }],
    // Critical
    [{ arr: 0.9, p: 3, r: "Americas" }, { arr: 2.1, p: 5, r: "Americas" }, { arr: 3.4, p: 6, r: "Americas" }, { arr: 1.2, p: 3, r: "EMEA" }, { arr: 0.4, p: 2, r: "LATAM" }],
  ];

  // Color scale based on value: green-amber-red oklch-ish via mix on tokens
  const colorFor = (v) => {
    // v in $M. cap at ~3.5
    const t = Math.min(1, v / 3.0);
    if (t < .15) return { bg: "var(--green-soft)", fg: "var(--green)", bd: "var(--green-bd)" };
    if (t < .35) return { bg: "color-mix(in oklch, var(--green-soft) 50%, var(--amber-soft) 50%)", fg: "var(--amber)", bd: "var(--amber-bd)" };
    if (t < .60) return { bg: "var(--amber-soft)", fg: "var(--amber)", bd: "var(--amber-bd)" };
    if (t < .85) return { bg: "color-mix(in oklch, var(--amber-soft) 30%, var(--red-soft) 70%)", fg: "var(--red)", bd: "var(--red-bd)" };
    return { bg: "var(--red-soft)", fg: "var(--red)", bd: "var(--red-bd)" };
  };

  return (
    <>
      <div className="heatmap-wrap">
        <div className="heatmap-y-labels">
          {yLabels.map(l => <div key={l} className="yl">{l}</div>)}
        </div>
        <div>
          <div className="heatmap-grid">
            {grid.map((row, yi) =>
              row.map((cell, xi) => {
                const c = colorFor(cell.arr);
                return (
                  <div
                    key={`${yi}-${xi}`}
                    className="heatmap-cell"
                    style={{
                      background: c.bg,
                      borderColor: c.bd,
                      color: c.fg,
                    }}
                    title={`${yLabels[yi]} · ${xLabels[xi]} — ${cell.p} partners · $${cell.arr.toFixed(1)}M at risk · ${cell.r}`}
                  >
                    <span className="v">${cell.arr.toFixed(1)}M</span>
                    <span className="sub">{cell.p}p · {cell.r}</span>
                  </div>
                );
              })
            )}
          </div>
          <div className="heatmap-x-labels">
            {xLabels.map(l => <div key={l}>{l}</div>)}
          </div>
        </div>
      </div>
      <div className="heatmap-legend">
        <span>$0M at risk</span>
        <span className="scale" />
        <span>$3.5M+ at risk</span>
        <span style={{ marginLeft: "auto" }}>
          ↓ Operational maturity &nbsp; · &nbsp; → Renewal proximity
        </span>
      </div>
      <div className="heatmap-notes">
        Highest exposure concentrates in <strong>Watch + Critical bands</strong> with renewals due in <strong>Q3 (90d)</strong> — predominantly <strong>Americas</strong>.
        $5.8M ARR sits in three cells where operational maturity and renewal proximity compound.
        Coaching and exec review should prioritize the Q2 → Q3 watch band before degradation continues.
      </div>
    </>
  );
};

<script type="text/babel">/* ─────────────────────────────────────────────────────────────
 * Partner Store v4 — progress framing, not evaluation framing
 * Partner sees: "Your health is improving relative to last quarter"
 * Not: "You are Healthy"
 * Trajectory is the primary message. Band is supporting context.
 * ───────────────────────────────────────────────────────────── */

const Tip = ({d,r,l}) => <i className={`tip${r?" tip-right":l?" tip-left":""}`} data-tip={d}>i</i>;

const PartnerStore = ({ store, partner }) => {
  const m = (window.momentum || momentum)(partner.sparkHealth, partner.healthDelta);
  const arrow = m.dir === "up" ? "↑" : m.dir === "down" ? "↓" : "→";

  // Progress-framed trajectory message
  const trajectoryMsg = () => {
    if (m.dir === "up" && m.label === "Accelerating") return "Your partnership health is accelerating — the improvements you've made are compounding.";
    if (m.dir === "up" && m.label === "Improving")    return "Your partnership health is improving relative to last quarter. Keep the momentum.";
    if (m.dir === "up")                                return "Your partnership health is recovering. You're moving in the right direction.";
    if (m.dir === "down" && m.velocity < -2)           return "Your partnership health has been declining this quarter. The actions below address the primary causes.";
    if (m.dir === "down")                              return "Your partnership health is slowing down. A few focused actions this week can reverse the trend.";
    return "Your partnership health is holding steady. Maintaining this level requires attention on the items below.";
  };

  return (
    <div className="store">

      {/* Banner — trajectory leads, not band */}
      <div className="store-banner">
        <div className="store-greet">{partner.name} · Partner Console</div>

        {/* Primary message: trajectory, not score */}
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:8 }}>
          <div style={{ fontSize:22, fontWeight:500, letterSpacing:"-.015em", color:"var(--ink)" }}>
            {trajectoryMsg()}
          </div>
        </div>

        {/* Trajectory indicator + band in one line */}
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, padding:"5px 12px", background:m.dir==="up"?"var(--green-soft)":m.dir==="down"?"var(--red-soft)":"var(--surface-3)", border:`1px solid ${m.dir==="up"?"var(--green-bd)":m.dir==="down"?"var(--red-bd)":"var(--border)"}`, borderRadius:100 }}>
            <span style={{ fontSize:15, fontWeight:700, color:m.color }}>{arrow}</span>
            <span style={{ fontSize:12, fontWeight:600, color:m.color }}>{m.label}</span>
          </div>
          <span style={{ fontSize:11, color:"var(--ink-3)" }}>·</span>
          <span style={{ fontSize:12, color:"var(--ink-3)" }}>
            {partner.healthDelta > 0 ? "+" : ""}{partner.healthDelta} pts vs last period
          </span>
          <span style={{ fontSize:11, color:"var(--ink-3)" }}>·</span>
          <span style={{ fontSize:12, color:"var(--ink-3)" }}>
            {store.healthBand === "Attention Needed" ? "Two operational signals need your attention" : "Operational health on track"}
          </span>
          <Tip d={"This surface shows your partnership health from your perspective.\nPowered by PIP — same intelligence your PAM sees, with internal scoring redacted.\nUpdated weekly from CRM, Desk, Renewals, and Certification data."} />
        </div>
      </div>

      <div className="store-body">

        {/* LEFT — operational bands + customer portfolio */}
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

          {/* Operational health — trajectory context added */}
          <section className="store-card">
            <header className="card-head">
              <div className="card-title">
                Operational Health
                <Tip d={"Your composite performance across certifications, renewals, customer health, and support quality.\nUpdated weekly.\nYou see your band — not the internal score number."} />
              </div>
              <div className="card-sub">Composite of cross-system signals</div>
            </header>
            <div className="card-body" style={{ display:"grid", gridTemplateColumns:"minmax(200px,280px) 1fr", gap:22, alignItems:"center" }}>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {/* Trajectory first */}
                <div>
                  <div style={{ fontSize:10, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-3)", marginBottom:3 }}>Direction</div>
                  <div style={{ fontSize:24, fontWeight:600, color:m.color }}>
                    {arrow} {m.label}
                  </div>
                  <div style={{ fontSize:11, color:"var(--ink-3)", marginTop:2 }}>
                    {partner.healthDelta > 0 ? "+" : ""}{partner.healthDelta} pts · last 30 days
                  </div>
                </div>
                {/* Band — supporting context */}
                <div style={{ paddingTop:8, borderTop:"1px solid var(--border)" }}>
                  <div style={{ fontSize:10, fontWeight:600, letterSpacing:".07em", textTransform:"uppercase", color:"var(--ink-3)", marginBottom:3 }}>
                    Composite <Tip d={"Your overall operational health band.\nYou see the band (Healthy / Attention Needed / Critical) — not the internal score number.\nInternal scoring is redacted."} />
                  </div>
                  <div style={{ fontFamily:"var(--font-mono)", fontSize:18, fontWeight:500, color: m.dir==="up"?"var(--green)":m.dir==="down"?"var(--red)":"var(--amber)" }}>
                    {store.healthBand}

              </div>
              <div style={{ fontSize:13, color:"var(--ink-2)", lineHeight:1.55 }}>
                {store.healthMsg} Most signals trace to onboarding handoffs and Creator certifications nearing expiry.

          </section>

          {/* Operational Bands */}
          <section className="store-card">
            <header className="card-head">
              <div className="card-title">
                Operational Bands

              {[

                  </div>
                  <span className={`store-band-pill ${b.band}`}>{b.v.band.split(" ")[0]}</span>
                </div>
              ))}
            </div>
          </section>

          {/* Customer portfolio */}
          <section className="store-card">
            <header className="card-head">
              <div className="card-title">
                Customer Portfolio
                <Tip d={"Your active customer book by action priority.\nNeed Outreach = health score below 60 OR renewal due within 30 days with no recent touch.\nExpansion-ready = cross-sell affinity flag in CRM."} />
              </div>
              <div className="card-sub">{partner.customers} active · {store.customers.msg.split(".")[0]}</div>
            </header>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", borderTop:"1px solid var(--border)" }}>
              {[
                { l:"Active Customers", v:partner.customers, sub:"+4 last quarter",   c:"" },
                { l:"Need Outreach",    v:11, sub:"Renewals + escalations",            c:"amber" },
                { l:"Expansion-ready",  v:4,  sub:"Cross-sell eligible",               c:"green" },
                { l:"Annual Renewals",  v:18, sub:"Next 90 days",                      c:"" },
              ].map((c,i) => (
                <div key={i} style={{ padding:"14px 16px", borderRight:i<3?"1px solid var(--border)":"none" }}>
                  <div className="label" style={{ marginBottom:4 }}>{c.l}</div>
                  <div className={`mono ${c.c?"t-"+c.c:"t-ink"}`} style={{ fontSize:22, fontWeight:500, letterSpacing:"-.025em" }}>{c.v}</div>
                  <div style={{ fontSize:11, color:"var(--ink-3)", marginTop:2 }}>{c.sub}</div>
                </div>
              ))}
            </div>
          </section>

        </div>

        {/* RIGHT — actions + benchmarks */}
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

          {/* Benchmark insights — MOVED UP, now before actions */}
          <section className="store-card">
            <header className="card-head">
              <div className="card-title">
                How You Compare
                <Tip d={"Anonymous comparison against partners at your tier and region.\nSource: Analytics daily sync — individual partner data is never shared.\nTop 22% CRR means 78% of comparable partners have lower retention."} />
              </div>
              <div className="card-sub">vs. {partner.tier} partners in {partner.region} · anonymous · quarterly</div>
            </header>
            <div>
              {store.benchmarks.map((b,i) => (
                <div className="bench-row" key={i}>
                  <span className={`dot ${b.band}`} style={{ marginTop:6 }}/>
                  <div style={{ fontSize:12.5, color:"var(--ink-2)", lineHeight:1.5 }}>{b.text}</div>
                </div>
              ))}
              {/* Trajectory benchmark */}
              <div className="bench-row" style={{ background:"var(--surface-2)" }}>
                <span className={`dot ${m.dir==="up"?"green":m.dir==="down"?"red":"neutral"}`} style={{ marginTop:6 }}/>
                <div style={{ fontSize:12.5, color:"var(--ink-2)", lineHeight:1.5 }}>
                  Your health trajectory is <strong style={{ color:m.color }}>{m.label.toLowerCase()}</strong> — {
                    m.dir==="up" ? "ahead of the majority of peers this quarter." :
                    m.dir==="down" ? "below the majority of peers this quarter." :
                    "in line with the majority of peers this quarter."
                  }
                </div>
              </div>
              <div className="bench-row" style={{ background:"var(--surface-2)", flexDirection:"column", alignItems:"flex-start", borderTop:"1px solid var(--border)" }}>
                <div className="label" style={{ marginBottom:4 }}>
                  Ecosystem baseline
                  <Tip d={"Behavior pattern of top-decile Premium partners in your region.\nShown as an aspirational target, not a judgment."} />
                </div>
                <div style={{ fontSize:11.5, color:"var(--ink-3)", lineHeight:1.5 }}>
                  Top-performing Premium partners maintain certification coverage above 85% and resolve escalations 37% faster than median.
                </div>
              </div>
            </div>
          </section>

          {/* Recommended Actions */}
          <section className="store-card">
            <header className="card-head">
              <div className="card-title">
                Actions · This Week
                <Tip d={"Generated weekly from your specific operational signals.\nOrdered by: ARR impact × urgency × ease of action.\nActing on these improves both operational health and your annual Partner Score."} />
              </div>

<script type="text/babel">/* ─────────────────────────────────────────────────────────────
 * PIP Tweaks panel — operational controls + live recompute
 *
 * Exposes:
 *   - Direction (A / B)
 *   - Density (comfortable / compact)
 *   - Weight priority (revenue / operational / renewal / escalation)
 *   - Threshold sensitivity
 *   - Regional, certification, support, ARR concentration knobs
 *   - "Show recompute explainability live" toggle
 *
 * The whole point: every drag should cause a visible recompute.
 * ───────────────────────────────────────────────────────────── */

const PIPTweaks = ({ tweaks, setTweak, onRecomputed }) => {

      <TweakSlider

      <TweakSlider

      <TweakSlider

        value={tweaks.weightEscalation}

      />

      <TweakSection label="Sensitivities" />
      <TweakSlider
        label="Threshold sensitivity"

      <TweakSlider

      <TweakSlider

      <TweakSlider

<script type="text/babel">/* ─────────────────────────────────────────────────────────────
 * PIP — App root + routing between persona surfaces.
 * ───────────────────────────────────────────────────────────── */

const { useState, useEffect, useRef, useMemo } = React;

const App = () => {
  const data = window.PIP_DATA;
  const [t, setTweak] = useTweaks(window.PIP_TWEAK_DEFAULTS);

  const [persona, setPersona] = useState("pam");
  const [activePartnerId, setActivePartnerId] = useState(data.partners[0].id);
  const [cliqOpen, setCliqOpen]   = useState(false);
  const [cliqEscId, setCliqEscId] = useState(data.escalations[0].id);

  // Recompute toast
  const [recompute, setRecompute] = useState(null);
  const timer = useRef(null);
  const triggerRecompute = (label) => {
    if (!t.showRecomputeLive) return;
    setRecompute(label);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => setRecompute(null), 1400);
  };

  // Apply direction + density on root
  useEffect(() => {
    document.documentElement.setAttribute("data-direction", t.direction || "a");
    document.documentElement.classList.toggle("dense", t.density === "compact");
  }, [t.direction, t.density]);

  // Recompute partner health when weights change (deterministic recomputation)
  const partners = useMemo(() => {
    const weights = {
      financial:   t.weightRevenue,
      operational: t.weightOperational,
      renewal:     t.weightRenewal,
      escalation:  t.weightEscalation,
    };
    const total = Object.values(weights).reduce((s, n) => s + n, 0) || 1;
    return data.partners.map(p => {
      const computed = (
        weights.financial   * p.sub.financial   +
        weights.operational * p.sub.operational +
        weights.renewal     * p.sub.renewal     +
        weights.escalation  * Math.max(0, 100 - p.escalations.open * 6)
      ) / total;
      const sensAdj = ((t.thresholdSensitivity || 50) - 50) * .2;
      const certAdj = ((t.certificationInfluence || 60) - 60) * .04 * (p.certifications.ratio - .7);
      return {
        ...p,
        health: Math.max(0, Math.min(100, Math.round(computed - sensAdj + certAdj * 10))),
      };
    });
  }, [data.partners, t.weightRevenue, t.weightOperational, t.weightRenewal, t.weightEscalation, t.thresholdSensitivity, t.certificationInfluence]);

  const activePartner = partners.find(p => p.id === activePartnerId) || partners[0];

  const openCliq = (escId) => {
    setCliqEscId(escId);
    setCliqOpen(true);
  };
  const activeEsc = data.escalations.find(e => e.id === cliqEscId);

  const onOpenPartner = (id) => {
    setActivePartnerId(id);
    setPersona("p360");
  };

  // For the tweaks panel — wraps setTweak and triggers recompute toast
  const setTweakAndRecompute = (k, v) => {
    setTweak(k, v);
    if ([
      "weightRevenue", "weightOperational", "weightRenewal", "weightEscalation",
      "thresholdSensitivity", "regionalWeighting", "certificationInfluence",
      "supportEscalationImpact", "arrConcentrationSensitivity",
    ].includes(k)) {
      triggerRecompute(k);
    }
  };

  return (
    <div className="app-shell">
      <Chrome
        persona={persona}
        setPersona={setPersona}
        activePartner={activePartner}
        partners={partners}
      />

      <main className="surface">
        {persona === "pam" && (
          <PAMPortfolio
            partners={partners}
            signals={data.signals}
            escalations={data.escalations}
            activePartnerId={activePartnerId}
            setActivePartnerId={setActivePartnerId}
            onOpenPartner={onOpenPartner}
            onOpenCliq={openCliq}
            tweaks={t}
          />
        )}
        {persona === "p360" && (
          <PartnerIntelligence
            partner={activePartner}
            onBack={() => setPersona("pam")}
            onOpenCliq={openCliq}
            escalations={data.escalations}
            tweaks={t}
          />
        )}
        {persona === "director" && (
          <Director
            ecosystem={data.ecosystem}
            partners={partners}
          />
        )}
        {persona === "store" && (
          <PartnerStore
            store={data.partnerStore}
            partner={activePartner.id === data.partnerStore.me.id ? activePartner : data.partnerStore.me}
          />
        )}
      </main>

      <CliqDrawer
        escalation={activeEsc}
        open={cliqOpen}
        onClose={() => setCliqOpen(false)}
      />

      <PIPTweaks
        tweaks={t}
        setTweak={setTweakAndRecompute}
        onRecomputed={triggerRecompute}
      />

      {/* Recompute toast */}
      <div className={`recompute-overlay ${recompute ? "show" : ""}`}>
        <span className="dot" />
        <span style={{ color: "var(--ink-4)" }}>recompute</span>
        <span style={{ color: "#f6f4ef" }}>{recompute}</span>
        <span style={{ color: "var(--ink-4)" }}>· {partners.length} partners</span>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<div id="pip-tooltip"></div>
<script>
(function(){
  var box=document.getElementById('pip-tooltip'),cur=null;
  function show(el){var t=el.getAttribute('data-tip');if(!t)return;box.textContent=t;cur=el;pos();box.classList.add('visible');}
  function hide(){box.classList.remove('visible');cur=null;}
  function pos(){if(!cur)return;var r=cur.getBoundingClientRect(),bw=280,mg=12,vw=window.innerWidth;var l=r.left+r.width/2-bw/2;l=Math.max(mg,Math.min(l,vw-bw-mg));box.style.visibility='hidden';box.style.top='0px';box.style.left=l+'px';var bh=box.offsetHeight||80,top=r.top-bh-10;if(top<mg)top=r.bottom+10;box.style.top=top+'px';box.style.visibility='';var al=(r.left+r.width/2)-l-5;al=Math.max(8,Math.min(al,bw-18));box.style.setProperty('--arrow-left',al+'px');}
  document.addEventListener('mouseover',function(e){var el=e.target.closest?e.target.closest('.tip'):null;if(el&&el!==cur)show(el);});
  document.addEventListener('mouseout',function(e){var el=e.target.closest?e.target.closest('.tip'):null;if(el){var to=e.relatedTarget;if(!to||!(to.closest&&to.closest('.tip')))hide();}});
  document.addEventListener('scroll',pos,true);window.addEventListener('resize',pos);
})();
</script>
