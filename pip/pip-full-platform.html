<!DOCTYPE html>
<html lang="en" data-direction="a">
<head>
<meta charset="utf-8">
<title>PIP · Partner Intelligence Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
/* ─────────────────────────────────────────────────────────────────
 * PIP — Partner Intelligence Platform
 * Visual system — IBM Plex, warm neutrals, restrained accents.
 * Two directions:
 *   A) Operational Enterprise (default) — dense, tabular, ServiceNow/Datadog-grade
 *   B) Modern Ecosystem Intelligence       — softer spacing, stronger hierarchy
 * Direction is toggled by data-direction="a|b" on <html>.
 * ───────────────────────────────────────────────────────────── */

:root {
  /* surfaces */
  --bg:            #F4F2EC;
  --bg-2:          #FAFAF7;
  --surface:       #FFFFFF;
  --surface-2:     #FBFAF6;
  --surface-3:    #F0EEE7;
  --surface-4:    #E9E6DC;

  /* borders */
  --border:        #E5E2D8;
  --border-2:      #D4D1C4;
  --border-3:      #BFBBAB;

  /* ink */
  --ink:           #181613;
  --ink-2:         #4B4A44;
  --ink-3:         #82807A;
  --ink-4:         #B0ADA3;
  --ink-5:         #D7D4C9;

  /* accents — restrained */
  --red:           #B0231C;
  --red-soft:      #FAE7E4;
  --red-bd:        #E5B0AA;
  --amber:         #A2570B;
  --amber-soft:    #F7EBCF;
  --amber-bd:      #E2C896;
  --green:         #14653A;
  --green-soft:    #E1EEE5;
  --green-bd:      #A5CFB1;
  --blue:          #1B3E94;
  --blue-soft:     #DDE5F5;
  --blue-bd:       #A8B9E1;
  --violet:        #4E1F9D;
  --violet-soft:   #E7E1F4;
  --violet-bd:     #BFB0E3;

  /* zoho hint — used only for the brand mark */
  --zoho-red:      #C8202D;

  /* type */
  --font-sans:     "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --font-mono:     "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;

  /* radius */
  --r-xs:          2px;
  --r-sm:          3px;
  --r-md:          5px;
  --r-lg:          8px;
  --r-xl:          12px;

  /* shadows */
  --shadow-sm:     0 1px 0 rgba(24,22,19,.04);
  --shadow-md:     0 1px 2px rgba(24,22,19,.05), 0 0 0 1px rgba(24,22,19,.04);
  --shadow-lg:     0 4px 16px -4px rgba(24,22,19,.10), 0 0 0 1px rgba(24,22,19,.04);

  /* layout */
  --row-h:         32px;
  --row-h-dense:   28px;
  --gap:           16px;
  --gap-tight:     12px;
}

/* ── Direction B overrides ─────────────────────────────────────── */
:root[data-direction="b"] {
  --bg:            #F7F5F0;
  --bg-2:          #FCFBF8;
  --surface-3:    #F3F1EA;
  --border:        #ECE9DF;
  --border-2:      #DEDBCF;
  --r-md:          6px;
  --r-lg:          10px;
  --r-xl:          14px;
  --gap:           20px;
  --gap-tight:     14px;
  --row-h:         36px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "ss02", "cv11";
  overflow: hidden;
}
:root[data-direction="b"] body {
  font-size: 13.5px;
  line-height: 1.5;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button { cursor: pointer; background: none; border: none; padding: 0; }

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.num { text-align: right; }

/* ── Reusable atoms ────────────────────────────────────────────── */
.label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.kicker {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.h-eyebrow {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: .02em;
}

.dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  vertical-align: middle;
}
.dot.green  { background: var(--green); }
.dot.amber  { background: var(--amber); }
.dot.red    { background: var(--red); }
.dot.blue   { background: var(--blue); }
.dot.violet { background: var(--violet); }
.dot.neutral { background: var(--ink-4); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 10.5px;
  font-weight: 500;
  background: var(--surface-3);
  color: var(--ink-2);
  border: 1px solid var(--border);
  white-space: nowrap;
  line-height: 1.6;
}
.chip.green  { background: var(--green-soft); color: var(--green); border-color: var(--green-bd); }
.chip.amber  { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-bd); }
.chip.red    { background: var(--red-soft); color: var(--red); border-color: var(--red-bd); }
.chip.blue   { background: var(--blue-soft); color: var(--blue); border-color: var(--blue-bd); }
.chip.violet { background: var(--violet-soft); color: var(--violet); border-color: var(--violet-bd); }
.chip.ghost  { background: transparent; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  border-radius: var(--r-md);
  font-size: 12px;
  font-weight: 500;
  background: var(--surface);
  color: var(--ink-2);
  border: 1px solid var(--border-2);
  transition: .12s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); color: var(--ink); }
.btn.primary {
  background: var(--ink);
  color: var(--bg-2);
  border-color: var(--ink);
}
.btn.primary:hover { background: #2a2723; color: var(--bg-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -.005em;
  color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.card-title-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  background: var(--surface-3);
  padding: 1px 5px;
  border-radius: 3px;
}
.card-sub {
  font-size: 11px;
  color: var(--ink-3);
}
.card-actions { display: flex; align-items: center; gap: 6px; }
.card-body { padding: 14px; }
.card-body.flush { padding: 0; }

/* Scrollbars — muted */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--border-2);
  border-radius: 6px;
  border: 2px solid var(--bg);
  background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--border-3); background-clip: padding-box; border: 2px solid var(--bg); }

/* sparkline svg style */
.spark { display: block; }
.spark .grid { stroke: var(--border); stroke-width: .5; }
.spark .axis { stroke: var(--border-2); stroke-width: .5; }
.spark path.line   { fill: none; stroke-width: 1.4; }
.spark path.area   { opacity: .12; }
.spark .pt         { stroke: var(--surface); stroke-width: 1.5; }

/* Health colour helpers */
.t-green { color: var(--green); }
.t-amber { color: var(--amber); }
.t-red   { color: var(--red); }
.t-blue  { color: var(--blue); }
.t-ink   { color: var(--ink); }
.t-ink-2 { color: var(--ink-2); }
.t-ink-3 { color: var(--ink-3); }
.t-ink-4 { color: var(--ink-4); }

/* Density utility */
.dense .card-body { padding: 12px; }
.dense .card-head { padding: 8px 12px; }

/* ─── App-level layout ──────────────────────────────────────── */
html, body { min-width: 1440px; }
.app-shell {
  display: grid;
  grid-template-rows: 44px 1fr;
  height: 100vh;
  min-width: 1440px;
  overflow: hidden;
}

/* Top chrome */
.chrome {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.chrome-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
.chrome-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

.brand {
  display: flex; align-items: center; gap: 8px;
  padding-right: 12px;
  border-right: 1px solid var(--border);
  height: 28px;
  flex-shrink: 0;
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 4px;
  background: var(--ink);
  color: #F4F2EC;
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: -.04em;
}
.brand-name {
  font-size: 12.5px; font-weight: 600;
  letter-spacing: -.005em;
  color: var(--ink);
  white-space: nowrap;
}
.brand-sub {
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
  font-family: var(--font-mono);
}

.crumbs {
  display: flex; align-items: center; gap: 4px;
  font-size: 11.5px;
  color: var(--ink-3);
  min-width: 0;
}
.crumbs .sep { color: var(--ink-4); }
.crumbs .crumb { color: var(--ink-3); white-space: nowrap; }
.crumbs .crumb.active { color: var(--ink); font-weight: 500; }
.crumbs button { color: inherit; }

/* Persona switcher in center */
.persona-switch {
  display: flex; gap: 0;
  background: var(--surface-3);
  border-radius: var(--r-md);
  padding: 2px;
  border: 1px solid var(--border);
}
.persona-switch button {
  padding: 4px 12px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  border-radius: var(--r-sm);
  letter-spacing: .005em;
  display: inline-flex; align-items: center; gap: 6px;
  transition: .12s;
  white-space: nowrap;
}
.persona-switch button:hover { color: var(--ink-2); }
.persona-switch button.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.persona-switch button .pkicker {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-4);
  letter-spacing: -.02em;
}
.persona-switch button.active .pkicker { color: var(--ink-3); }

.global-search {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 4px 8px;
  width: 240px;
}
.global-search input {
  border: none; background: transparent; outline: none;
  font-size: 12px; color: var(--ink); width: 100%;
}
.global-search input::placeholder { color: var(--ink-4); }
.kbd {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--ink-4);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 1px 4px; border-radius: 3px;
}
.chrome-icon-btn {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--ink-3);
  border-radius: var(--r-md);
}
.chrome-icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.chrome-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blue-soft);
  color: var(--blue);
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 600;
  border: 1px solid var(--blue-bd);
}

/* Surface root */
.surface {
  overflow: hidden;
  min-height: 0;
}

/* ─── PAM Command Center ───────────────────────────────────── */
.pam-cc {
  display: grid;
  grid-template-columns: 264px 1fr 320px;
  height: 100%;
  min-height: 0;
}
:root[data-direction="b"] .pam-cc {
  grid-template-columns: 280px 1fr 340px;
}
.pam-cc > .col { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.pam-cc .col.left   { background: var(--surface); border-right: 1px solid var(--border); }
.pam-cc .col.center { background: var(--bg); overflow-y: auto; }
.pam-cc .col.right  { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }

/* ── Left rail: portfolio scope ── */
.scope-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.scope-title {
  font-size: 11.5px; font-weight: 600;
  color: var(--ink); margin-bottom: 2px;
}
.scope-meta {
  font-size: 10.5px;
  color: var(--ink-3);
  font-family: var(--font-mono);
}
.scope-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
}
.scope-tab {
  padding: 8px 8px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  border-bottom: 2px solid transparent;
  letter-spacing: -.005em;
}
.scope-tab.active {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.scope-tab:hover { color: var(--ink-2); }

.scope-filters {
  display: flex; gap: 4px; padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.f-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px;
  font-size: 10.5px;
  color: var(--ink-2);
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 100px;
}
.f-chip.on {
  background: var(--ink);
  color: var(--bg-2);
  border-color: var(--ink);
}

.scope-list {
  overflow-y: auto;
  flex: 1;
  padding: 4px 0;
}
.scope-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-left: 2px solid transparent;
  cursor: pointer;
  transition: background .1s;
  min-height: 48px;
}
.scope-row:hover { background: var(--surface-2); }
.scope-row.active {
  background: var(--surface-3);
  border-left-color: var(--ink);
}
.sr-name { font-size: 12px; font-weight: 500; color: var(--ink); letter-spacing: -.005em; }
.sr-meta { font-size: 10.5px; color: var(--ink-3); font-family: var(--font-mono); margin-top: 2px;}
.sr-score {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 600;
  text-align: right;
}
.sr-score.green { color: var(--green); }
.sr-score.amber { color: var(--amber); }
.sr-score.red   { color: var(--red); }
.sr-delta {
  font-size: 10px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  text-align: right;
  margin-top: 1px;
}
.sr-delta.down { color: var(--red); }
.sr-delta.up   { color: var(--green); }
.sr-flag {
  font-size: 10px;
  color: var(--red);
  margin-top: 1px;
  font-family: var(--font-mono);
}

/* ── Center: command center body ── */
.cc-body {
  padding: 14px 16px 24px;
  display: flex; flex-direction: column;
  gap: 14px;
}
:root[data-direction="b"] .cc-body { padding: 20px 24px 28px; gap: 18px; }

/* Headline strip — operational synthesis */
.synth-strip {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.synth-line {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--ink);
  border-radius: var(--r-md);
  padding: 10px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
}
.synth-line.high   { border-left-color: var(--red); }
.synth-line.medium { border-left-color: var(--amber); }
.synth-line.low    { border-left-color: var(--ink-3); }
.synth-kicker {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.synth-text {
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -.005em;
}
.synth-text strong { font-weight: 600; }
.synth-actions {
  display: flex; gap: 6px;
  align-items: center;
}

/* KPI strip */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.kpi-cell {
  padding: 12px 14px;
  border-right: 1px solid var(--border);
}
.kpi-cell:last-child { border-right: none; }
.kpi-l {
  font-size: 10px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 4px;
}
.kpi-v {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -.025em;
  line-height: 1;
}
:root[data-direction="b"] .kpi-v { font-size: 26px; font-weight: 400; }
.kpi-v.green { color: var(--green); }
.kpi-v.amber { color: var(--amber); }
.kpi-v.red   { color: var(--red); }
.kpi-s {
  display: flex; align-items: center; gap: 6px;
  font-size: 10.5px;
  color: var(--ink-3);
  margin-top: 4px;
}
.kpi-delta {
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.kpi-delta.up { color: var(--green); }
.kpi-delta.down { color: var(--red); }

/* Portfolio table */
.ptable-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  table-layout: fixed;
}
/* Column widths: Partner | Trajectory | Health | ARR Risk | Ren 90d | Esc | Lead Signal */
.ptable colgroup col:nth-child(1) { width: 160px; }
.ptable colgroup col:nth-child(2) { width: 148px; }
.ptable colgroup col:nth-child(3) { width: 120px; }
.ptable colgroup col:nth-child(4) { width: 100px; }
.ptable colgroup col:nth-child(5) { width: 90px;  }
.ptable colgroup col:nth-child(6) { width: 90px;  }
.ptable colgroup col:nth-child(7) { width: auto;  }
.ptable thead th {
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  color: var(--ink-3);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 8px 12px;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ptable thead th.num { text-align: right; }
.ptable tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
  cursor: pointer;
}
.ptable tbody tr:last-child { border-bottom: none; }
.ptable tbody tr:hover { background: var(--surface-2); }
.ptable tbody tr.active { background: var(--surface-3); }
.ptable td {
  padding: 10px 12px;
  vertical-align: middle;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
}
.ptable td.num {
  font-family: var(--font-mono);
  text-align: right;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ptable td.name {
  color: var(--ink);
  font-weight: 500;
}
.ptable .row-flag {
  display: inline-block;
  width: 3px; height: 18px; border-radius: 2px;
  margin-right: 8px; vertical-align: middle;
}
.ptable .row-flag.green  { background: var(--green); }
.ptable .row-flag.amber  { background: var(--amber); }
.ptable .row-flag.red    { background: var(--red); }
.ptable .row-flag.neutral { background: var(--border-2); }
.ptable .bar {
  display: inline-block;
  height: 4px;
  border-radius: 4px;
  background: var(--surface-3);
  vertical-align: middle;
  position: relative;
  width: 64px;
}
.ptable .bar .fill {
  position: absolute; left: 0; top: 0;
  height: 100%; border-radius: 4px;
}
.ptable .bar .fill.green { background: var(--green); }
.ptable .bar .fill.amber { background: var(--amber); }
.ptable .bar .fill.red   { background: var(--red); }
.ptable td.health {
  white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
  color: var(--ink);
}
.ptable td.health .sc {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 12px;
  min-width: 22px;
}
.spark-cell { display: flex; align-items: center; justify-content: flex-end; }
.spark-cell svg { display: block; }

/* ── Right rail: live signal feed + actions ── */
.rail-h {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
}
.rail-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 var(--green-bd);
  animation: pulse 2.4s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(20,101,58,.4); }
  70%  { box-shadow: 0 0 0 8px rgba(20,101,58,0); }
  100% { box-shadow: 0 0 0 0 rgba(20,101,58,0); }
}

.feed { padding: 4px 0; }
.feed-row {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.feed-row:hover { background: var(--surface-2); }
.feed-row:last-child { border-bottom: none; }
.feed-ts {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  white-space: nowrap;
  padding-top: 2px;
}
.feed-body { min-width: 0; }
.feed-partner {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 2px;
  letter-spacing: -.005em;
}
.feed-text {
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.4;
}
.feed-src {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .03em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-top: 4px;
}
.feed-dot {
  margin-top: 6px;
}

/* Recommended actions list */
.action-list { padding: 4px 0; }
.action-row {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.action-row:last-child { border-bottom: none; }
.action-row:hover { background: var(--surface-2); }
.action-num {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-4);
  text-align: right;
  padding-top: 2px;
}
.action-title {
  font-size: 12px;
  color: var(--ink);
  font-weight: 500;
  letter-spacing: -.005em;
}
.action-meta {
  font-size: 10.5px;
  color: var(--ink-3);
  margin-top: 4px;
  display: flex; gap: 10px;
  font-family: var(--font-mono);
}

/* ─── Partner Intelligence Detail ───────────────────────────────────── */
.p360 {
  display: grid;
  grid-template-columns: 1fr 360px;
  height: 100%;
  min-height: 0;
}
:root[data-direction="b"] .p360 { grid-template-columns: 1fr 380px; }
.p360 > .col { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.p360 .col.main  { background: var(--bg); overflow-y: auto; }
.p360 .col.right { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }

.p360-snap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
}
.p360-snap-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 14px;
  gap: 24px;
}
.p360-id { display: flex; align-items: flex-start; gap: 12px; }
.p360-avatar {
  width: 40px; height: 40px;
  border-radius: var(--r-md);
  background: var(--surface-3);
  color: var(--ink);
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -.04em;
  border: 1px solid var(--border);
}
.p360-name {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.015em;
  color: var(--ink);
}
:root[data-direction="b"] .p360-name { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.p360-sub {
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 2px;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
}
.p360-tags {
  display: flex; gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.p360-score-block {
  text-align: right;
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 2px;
}
.p360-score-l {
  font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3);
}
.p360-score-v {
  font-family: var(--font-mono);
  font-size: 44px;
  font-weight: 300;
  letter-spacing: -.04em;
  line-height: 1;
}
:root[data-direction="b"] .p360-score-v { font-size: 56px; font-weight: 200; }
.p360-score-v.green { color: var(--green); }
.p360-score-v.amber { color: var(--amber); }
.p360-score-v.red   { color: var(--red); }
.p360-score-band {
  font-size: 11px;
  font-weight: 500;
}
.p360-score-band.green { color: var(--green); }
.p360-score-band.amber { color: var(--amber); }
.p360-score-band.red   { color: var(--red); }
.p360-score-delta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 2px;
}

/* KPI strip — partner snapshot */
.p360-kpi {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 1px;
  background: var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--border);
}
.p360-kpi .cell {
  background: var(--surface);
  padding: 10px 12px;
}
.p360-kpi .l {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 4px;
}
.p360-kpi .v {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -.02em;
}
.p360-kpi .v.green { color: var(--green); }
.p360-kpi .v.amber { color: var(--amber); }
.p360-kpi .v.red   { color: var(--red); }
.p360-kpi .s {
  font-size: 10px;
  color: var(--ink-4);
  margin-top: 2px;
}

/* Body grid */
.p360-body {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 14px;
  padding: 16px 20px 24px;
}
:root[data-direction="b"] .p360-body { gap: 18px; padding: 20px 24px 28px; }

/* WhyChanged */
.why-row {
  padding: 10px 14px;
  border-left: 2px solid transparent;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: 10px;
  align-items: flex-start;
}
.why-row:last-child { border-bottom: none; }
.why-row.risk   { border-left-color: var(--red); background: linear-gradient(90deg, var(--red-soft) 0%, var(--surface) 6%); }
.why-row.watch  { border-left-color: var(--amber); background: linear-gradient(90deg, var(--amber-soft) 0%, var(--surface) 6%); }
.why-row.stable { border-left-color: var(--green); }
.why-row.info   { border-left-color: var(--blue); }
.why-dim {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-top: 2px;
}
.why-text {
  font-size: 12.5px;
  color: var(--ink);
  line-height: 1.45;
}
.why-src {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-4);
  letter-spacing: .04em;
  text-transform: uppercase;
  padding-top: 4px;
  white-space: nowrap;
}

/* Sub-scores radial-ish bars */
.sub-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}
.sub-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.sub-row:nth-last-child(-n+2) { border-bottom: none; }
.sub-name {
  font-size: 11.5px;
  color: var(--ink-2);
}
.sub-v {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  min-width: 24px;
  text-align: right;
}
.sub-bar {
  grid-column: 1 / -1;
  height: 3px;
  border-radius: 3px;
  background: var(--surface-3);
  overflow: hidden;
}
.sub-bar .fill {
  height: 100%;
  border-radius: 3px;
  transition: width .4s ease;
}
.sub-bar .fill.green { background: var(--green); }
.sub-bar .fill.amber { background: var(--amber); }
.sub-bar .fill.red   { background: var(--red); }

/* Trajectory chart */
.traj-chart {
  padding: 12px 14px 8px;
}
.traj-chart svg { display: block; width: 100%; }
.traj-legend {
  display: flex; gap: 14px;
  padding: 0 14px 12px;
  font-size: 10.5px;
  color: var(--ink-3);
  font-family: var(--font-mono);
}
.traj-legend span { display: inline-flex; align-items: center; gap: 4px; }

/* Timeline (right rail) */
.timeline-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.timeline-row:last-child { border-bottom: none; }
.tl-t {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: .02em;
}
.tl-content { font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
.tl-content strong { color: var(--ink); font-weight: 500; }
.tl-who {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 2px;
}

/* Recompute panel — explainability */
.recompute {
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  padding: 12px 14px;
}
.recompute h5 {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.recompute-line {
  display: grid;
  grid-template-columns: 1fr auto;
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 3px 0;
  color: var(--ink-2);
  border-bottom: 1px dashed var(--border);
}
.recompute-line:last-child { border-bottom: none; }
.recompute-line .delta { font-weight: 500; }
.recompute-line .delta.up   { color: var(--green); }
.recompute-line .delta.down { color: var(--red); }
.recompute-foot {
  display: grid;
  grid-template-columns: 1fr auto;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink);
  font-weight: 500;
}

/* ─── Director Ecosystem ───────────────────────────────────── */
.director {
  height: 100%;
  overflow-y: auto;
  padding: 18px 24px 28px;
  background: var(--bg);
}
.director-h {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 14px;
  gap: 24px;
}
.director-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -.015em;
}
:root[data-direction="b"] .director-title { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.director-sub {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 2px;
}
.dir-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
}
:root[data-direction="b"] .dir-grid { gap: 18px; }

/* big number block */
.big-stat {
  padding: 16px;
}
.big-stat .l {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.big-stat .v {
  font-family: var(--font-mono);
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -.03em;
  color: var(--ink);
  line-height: 1;
}
:root[data-direction="b"] .big-stat .v { font-size: 40px; font-weight: 300; }
.big-stat .s {
  margin-top: 8px;
  font-size: 11px;
  color: var(--ink-3);
}

/* regional / tier table */
.dtable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.dtable thead th {
  font-size: 10px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3);
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  text-align: left;
}
.dtable thead th.num { text-align: right; }
.dtable td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.dtable tr:last-child td { border-bottom: none; }
.dtable td.num {
  font-family: var(--font-mono);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.dtable .row-name { font-weight: 500; color: var(--ink); }
.dtable .meter {
  display: inline-block;
  width: 100px; height: 4px;
  background: var(--surface-3);
  border-radius: 4px;
  position: relative;
  margin-right: 8px;
  vertical-align: middle;
}
.dtable .meter .fill {
  position: absolute; left: 0; top: 0; height: 100%;
  border-radius: 4px;
  background: var(--ink);
}

/* Insight cards (director) */
.insight {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: flex-start;
}
.insight:last-child { border-bottom: none; }
.insight-marker {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.insight-marker.high   { background: var(--red-soft); color: var(--red); }
.insight-marker.medium { background: var(--amber-soft); color: var(--amber); }
.insight-marker.low    { background: var(--surface-3); color: var(--ink-3); }
.insight-text { font-size: 12.5px; color: var(--ink); line-height: 1.5; }

/* PAM effectiveness */
.pam-row {
  display: grid;
  grid-template-columns: 1fr 80px 100px 80px 70px;
  gap: 10px;
  padding: 10px 14px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.pam-row:last-child { border-bottom: none; }
.pam-row.head {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--surface-2);
}
.pam-row .pname { color: var(--ink); font-weight: 500; }
.pam-row .num   { font-family: var(--font-mono); text-align: right; }

/* ─── Partner Store ───────────────────────────────────────── */
.store {
  height: 100%;
  overflow-y: auto;
  background: var(--bg);
  padding: 0;
}
.store-banner {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 18px 28px;
}
.store-greet {
  font-size: 11.5px;
  color: var(--ink-3);
  margin-bottom: 6px;
  font-family: var(--font-mono);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.store-title {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -.02em;
  margin-bottom: 6px;
}
:root[data-direction="b"] .store-title { font-size: 26px; font-weight: 400; }
.store-state {
  font-size: 13px;
  color: var(--ink-2);
  max-width: 600px;
}
.store-state strong { color: var(--ink); font-weight: 500; }
.store-body {
  padding: 18px 28px 28px;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
}
.store-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.store-band {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.store-band:last-child { border-bottom: none; }
.store-band-l {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.store-band-v {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.store-band-msg { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.store-band-pill {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 100px;
  font-weight: 500;
  white-space: nowrap;
}
.store-band-pill.green { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-bd); }
.store-band-pill.amber { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-bd); }
.store-band-pill.red   { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-bd); }

.actions-list .a-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.actions-list .a-row:last-child { border-bottom: none; }
.actions-list .a-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
  padding-top: 1px;
}
.actions-list .a-title {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -.005em;
}
.actions-list .a-impact {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
}
.actions-list .a-due {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  text-align: right;
  white-space: nowrap;
}
.bench-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.bench-row:last-child { border-bottom: none; }

/* ─── Cliq drawer ──────────────────────────────────────────── */
.cliq-drawer {
  position: fixed;
  top: 44px; right: 0;
  width: 460px;
  height: calc(100vh - 44px);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 24px -8px rgba(24,22,19,.12);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  z-index: 40;
  transform: translateX(100%);
  transition: transform .25s ease;
}
.cliq-drawer.open { transform: translateX(0); }
.cliq-h {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.cliq-h-l { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
.cliq-h-l .esc-id {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.cliq-h-l .sev, .cliq-h-l .chip { white-space: nowrap; }
.cliq-h-l .sev {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--red-soft);
  color: var(--red);
  font-weight: 600;
}
.cliq-h-l .sev.s2 { background: var(--amber-soft); color: var(--amber); }
.cliq-meta {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
  font-size: 11.5px;
}
.cliq-meta .l {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 2px;
}
.cliq-meta .v { color: var(--ink); font-family: var(--font-mono); font-size: 11.5px; }
.cliq-tl {
  overflow-y: auto;
  padding: 4px 0;
}
.cliq-channel {
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  padding: 12px 16px;
}
.cliq-channel-h {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;

    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);
    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),
    0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}

  .twk-chip>span>i:first-child{box-shadow:none}

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

/* ─── Sparkline ──────────────────────────────────────────── */
const Sparkline = ({ values, width = 96, height = 28, color = "var(--ink)", showArea = true }) => {
  if (!values || values.length < 2) return null;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const pts = values.map((v, i) => [
    i * stepX,
    height - 2 - ((v - min) / range) * (height - 4),
  ]);
  const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const da = d + ` L ${width} ${height} L 0 ${height} Z`;
  const last = pts[pts.length - 1];
  return (
    <svg width={width} height={height} className="spark" viewBox={`0 0 ${width} ${height}`}>
      {showArea && <path d={da} fill={color} className="area" />}
      <path d={d} stroke={color} className="line" />
      <circle cx={last[0]} cy={last[1]} r="2" fill={color} className="pt" />
    </svg>
  );
};

/* ─── Trajectory line chart (small but readable) ─────────── */
const TrajChart = ({ values, baseline, width = 480, height = 140, label = "" }) => {
  const padL = 32, padR = 8, padT = 12, padB = 18;
  const w = width - padL - padR, h = height - padT - padB;
  const all = values.concat(baseline || []);
  const min = Math.floor(Math.min(...all) / 5) * 5;
  const max = Math.ceil(Math.max(...all) / 5) * 5;
  const range = max - min || 1;
  const stepX = w / (values.length - 1);
  const toY = (v) => padT + h - ((v - min) / range) * h;
  const toX = (i) => padL + i * stepX;
  const pathFor = (arr) => arr.map((v, i) => (i === 0 ? "M" : "L") + toX(i) + " " + toY(v)).join(" ");
  const ticks = [min, Math.round((min + max) / 2), max];
  const monthLabels = ["Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May"];
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height}>
      {/* grid */}
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={width - padR} y1={toY(t)} y2={toY(t)} className="grid" stroke="var(--border)" strokeDasharray="2 3" />
          <text x={padL - 4} y={toY(t) + 3} textAnchor="end" fontSize="9.5" fill="var(--ink-4)" fontFamily="IBM Plex Mono">{t}</text>
        </g>
      ))}
      {/* x ticks */}
      {values.map((_, i) => i % 2 === 0 && (
        <text key={i} x={toX(i)} y={height - 4} textAnchor="middle" fontSize="9.5" fill="var(--ink-4)" fontFamily="IBM Plex Mono">
          {monthLabels[i % 12]}
        </text>
      ))}
      {/* baseline (regional avg) */}
      {baseline && (
        <path d={pathFor(baseline)} fill="none" stroke="var(--ink-4)" strokeWidth="1" strokeDasharray="3 3" />
      )}
      {/* main line */}
      <path d={pathFor(values)} fill="none" stroke="var(--ink)" strokeWidth="1.6" />
      {/* end dot */}
      <circle cx={toX(values.length - 1)} cy={toY(values[values.length - 1])} r="3" fill="var(--ink)" stroke="var(--surface)" strokeWidth="1.5" />
    </svg>
  );
};

<script type="text/babel">/* ─────────────────────────────────────────────────────────────
 * TRAJECTORY PRIMITIVES — shared across all 4 surfaces
 * momentum() is now a governing primitive, not an annotation.
 * Uses weighted slope across full 12-month spark history.
 * Drives: sort order, escalation urgency, attention allocation.
 * ───────────────────────────────────────────────────────────── */

const momentum = (spark, delta) => {
  if (!spark || spark.length < 2) return { label: "Stable", dir: "flat", color: "var(--ink-4)", velocity: 0 };
  
  // Weighted slope: recent points count more (exponential weights)
  const n = spark.length;
  let weightedSum = 0, weightTotal = 0;
  for (let i = 1; i < n; i++) {
    const w = Math.pow(1.4, i);          // more recent = higher weight
    weightedSum += (spark[i] - spark[i-1]) * w;
    weightTotal += w;
  }
  const velocity = weightTotal > 0 ? weightedSum / weightTotal : 0;
  
  // Acceleration: is the velocity itself increasing or decreasing?
  const recentV = n >= 3 ? spark[n-1] - spark[n-2] : velocity;
  const priorV  = n >= 4 ? spark[n-2] - spark[n-3] : velocity;
  const accelerating = recentV > priorV + 0.5;
  const decelerating = recentV < priorV - 0.5;

  if (velocity > 2.5)  return { label: accelerating ? "Accelerating" : "Improving",   dir: "up",   color: "var(--green)",  velocity, accelerating, decelerating };
  if (velocity > 0.5)  return { label: "Recovering",   dir: "up",   color: "var(--green)",  velocity, accelerating, decelerating };
  if (velocity < -2.5) return { label: decelerating ? "Declining"    : "Deteriorating", dir: "down", color: "var(--red)",    velocity, accelerating, decelerating };
  if (velocity < -0.5) return { label: "Decelerating", dir: "down", color: "var(--amber)", velocity, accelerating, decelerating };
  return                      { label: "Stable",        dir: "flat", color: "var(--ink-3)", velocity, accelerating, decelerating };
};

/* Trajectory urgency score — used for sorting, escalation weighting */
const trajectoryUrgency = (p) => {
  const m = momentum(p.sparkHealth, p.healthDelta);
  // Critical + declining = highest urgency. Healthy + improving = lowest.
  const healthPenalty = p.health < 50 ? 100 : p.health < 70 ? 50 : 0;
  const dirPenalty = m.dir === "down" ? 40 : m.dir === "flat" ? 10 : 0;
  const velocityPenalty = Math.abs(m.velocity) * (m.dir === "down" ? 8 : 0);
  return healthPenalty + dirPenalty + velocityPenalty;
};

/* ── MomentumTag — the display component ── */
const MomentumTag = ({ spark, delta, size = "md", showVelocity = false }) => {
  const m = momentum(spark, delta);
  const arrow = m.dir === "up" ? "↑" : m.dir === "down" ? "↓" : "→";
  const sizes = { sm: 10, md: 12, lg: 14, xl: 16 };
  const fs = sizes[size] || 12;
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:3, fontSize:fs, fontWeight:600, color:m.color, whiteSpace:"nowrap" }}>
      {arrow} {m.label}
      {showVelocity && <span style={{ fontSize:fs-1, fontWeight:400, opacity:.7, marginLeft:2 }}>
        ({m.velocity > 0 ? "+" : ""}{m.velocity.toFixed(1)}/mo)
      </span>}
    </span>
  );
};

/* ── EcosystemMomentumBar — portfolio-level trajectory density ── */
const EcosystemMomentumBar = ({ partners, label = "Portfolio momentum" }) => {
  const groups = { up: 0, flat: 0, down: 0 };
  partners.forEach(p => {
    const m = momentum(p.sparkHealth, p.healthDelta);
    groups[m.dir]++;
  });
  const total = partners.length;
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, fontSize:10, fontWeight:600, letterSpacing:".06em", textTransform:"uppercase", color:"var(--ink-3)" }}>
        {label}
        <i className="tip" data-tip={"Distribution of 30-day health trajectory across all partners in this view.\nImproving = upward weighted slope. Stable = near-flat. Declining = downward slope.\nThis tells you ecosystem direction — more actionable than average health score alone."}>i</i>
      </div>
      <div style={{ display:"flex", height:8, borderRadius:4, overflow:"hidden", border:"1px solid var(--border)" }}>
        <div title={`${groups.up} improving`}  style={{ background:"var(--green)", width:`${groups.up/total*100}%`, transition:"width .4s" }} />
        <div title={`${groups.flat} stable`}   style={{ background:"var(--border-2)", width:`${groups.flat/total*100}%`, transition:"width .4s" }} />
        <div title={`${groups.down} declining`}style={{ background:"var(--red)", width:`${groups.down/total*100}%`, transition:"width .4s" }} />
      </div>
      <div style={{ display:"flex", gap:12, fontSize:11 }}>
        <span style={{ color:"var(--green)",  fontWeight:500 }}>↑ {groups.up} improving</span>
        <span style={{ color:"var(--ink-3)"                  }}>→ {groups.flat} stable</span>
        <span style={{ color:"var(--red)",    fontWeight:500 }}>↓ {groups.down} declining</span>
      </div>
    </div>
  );
};

/* ── TrajectoryCard — first-class section for Partner Intelligence ── */
const TrajectoryCard = ({ partner, baseline }) => {
  const m = momentum(partner.sparkHealth, partner.healthDelta);
  const b = bandClass(partner.health);
  const trajText = () => {
    if (m.dir === "down" && m.label === "Declining") {
      return <>Trajectory has been <strong>declining for {Math.abs(Math.round(partner.healthDelta))} pts over 30 days</strong>, diverging from regional baseline. This pattern matches partners that lost 1+ enterprise renewals within 6 months in <span style={{ borderBottom:"1px dashed var(--ink-4)", cursor:"help" }} title="64% of partners with this signature lost ≥1 enterprise renewal within 6 months.">64% of historical cases</span>. Intervention is time-critical — the window is narrowing.</>;
    }
    if (m.dir === "down") {
      return <>Trajectory is <strong>decelerating</strong> — health is declining at a slowing rate, suggesting the destabilizing forces are being partially offset. The weighted velocity of {m.velocity.toFixed(1)} pts/month warrants monitoring but not emergency intervention yet. Review certification coverage and escalation load.</>;
    }
    if (m.label === "Recovering") {
      return <>Trajectory is <strong>recovering</strong> after a period of decline — a positive signal, but recovery is not yet confirmed as stable. Monitor for 2 more periods before reducing attention level. CRR and certification density are the leading indicators to watch.</>;
    }
    if (m.label === "Accelerating" || m.label === "Improving") {
      return <>Trajectory is <strong>{m.label.toLowerCase()}</strong> — health has moved {partner.healthDelta > 0 ? "+" : ""}{partner.healthDelta} pts over 30 days, outpacing regional baseline by {Math.round(partner.health - 72)} pts. Pattern aligns with partners reaching Tier-1 contribution within next FY. This trajectory, if sustained, supports tier progression.</>;
    }
    return <>Trajectory is <strong>stable</strong> — health has held within ±2 pts of prior period. Support dependency vs. certification growth ratio is the early signal worth monitoring next quarter.</>;
  };

  return (
    <section className="card">
      <header className="card-head">
        <div>
          <div className="card-title">
            Trajectory Intelligence
            <i className="tip" data-tip={"Where this partner is heading — not just where they are.\nMomentum computed from weighted slope of 12-month health score history.\nRecent months weighted more heavily than older data.\nVelocity = average monthly change (weighted). Acceleration = whether velocity is increasing."}>i</i>
          </div>
          <div className="card-sub">Weighted 12-month momentum · velocity + acceleration</div>
        </div>
        {/* Momentum — large, dominant */}
        <div style={{ textAlign:"right" }}>
          <MomentumTag spark={partner.sparkHealth} delta={partner.healthDelta} size="xl" showVelocity />
        </div>
      </header>

      {/* Interpretation — primary content */}
      <div style={{ padding:"14px 16px", borderBottom:"1px solid var(--border)", fontSize:13.5, color:"var(--ink)", lineHeight:1.6, fontFamily:"IBM Plex Serif, Georgia, serif", fontWeight:400 }}>
        {trajText()}
      </div>

      {/* Chart — supporting, not primary */}
      <div className="traj-chart" style={{ paddingTop:8 }}>
        <TrajChart values={partner.sparkHealth} baseline={baseline} height={120} />
      </div>
      <div className="traj-legend" style={{ padding:"6px 16px 10px" }}>
        <span><span className="dot" style={{ background:"var(--ink)" }} /> {partner.name}</span>
        <span><span className="dot" style={{ background:"var(--ink-4)" }} /> Regional baseline ({partner.region})</span>
      </div>

      {/* Velocity + acceleration metadata */}
      <div style={{ padding:"10px 16px", borderTop:"1px solid var(--border)", display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, background:"var(--surface-2)" }}>
        {[
          { l:"Velocity", tip:"Average monthly health score change, weighted by recency.\nPositive = improving. Negative = declining.\nMagnitude indicates speed of change.", v: `${m.velocity > 0 ? "+" : ""}${m.velocity.toFixed(1)} pts/mo`, c: m.dir === "up" ? "green" : m.dir === "down" ? "red" : "" },
          { l:"Acceleration", tip:"Whether the velocity itself is increasing or decreasing.\nAccelerating decline = urgency increasing.\nDecelerating decline = forces partially offset.\nAccelerating improvement = momentum building.", v: m.accelerating ? "↑ Accelerating" : m.decelerating ? "↓ Decelerating" : "→ Steady", c: m.accelerating && m.dir === "up" ? "green" : m.accelerating && m.dir === "down" ? "red" : "" },
          { l:"vs Baseline", tip:"This partner's 30-day health delta compared to the regional average for their tier.\nPositive = outperforming peers. Negative = underperforming.", v: `${partner.healthDelta > 0 ? "+" : ""}${partner.healthDelta} pts vs region`, c: partner.healthDelta > 0 ? "green" : partner.healthDelta < -3 ? "red" : "" },
        ].map((c,i) => (
          <div key={i}>
            <div className="label" style={{ marginBottom:3 }}>{c.l} <i className="tip" data-tip={c.tip}>i</i></div>
            <div style={{ fontSize:13, fontWeight:600, color: c.c ? `var(--${c.c})` : "var(--ink)" }}>{c.v}</div>
          </div>
        ))}
      </div>
    </section>
  );
};

Object.assign(window, { momentum, trajectoryUrgency, MomentumTag, EcosystemMomentumBar, TrajectoryCard });

/* ── interpretPartner — signal interpretation per partner ── */
const interpretPartner = (p) => {
  const out = [];
  const opAvg = (p.sub.financial + p.sub.operational + p.sub.delivery) / 3;
